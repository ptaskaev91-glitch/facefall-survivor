<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Facefall Engine Next</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#060a08;color:#e8eee9;font-family:Inter,system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .lab-ui{position:fixed;inset:0;pointer-events:none}
    .lab-badge{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:8px 10px;border:1px solid rgba(255,255,255,.12);background:rgba(4,9,7,.7);backdrop-filter:blur(10px);font-size:11px;letter-spacing:.12em}
    .lab-controls{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
    button{border:1px solid rgba(255,255,255,.16);background:rgba(8,15,11,.8);color:#e8eee9;padding:9px 12px;border-radius:10px;font:600 11px/1 system-ui;letter-spacing:.09em;touch-action:none}
    button[data-active="true"]{background:#d9f27d;color:#12180d;border-color:#d9f27d}
    .run-hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:56px;display:flex;gap:6px}
    .run-hud span{padding:7px 9px;border:1px solid rgba(255,255,255,.1);background:rgba(4,9,7,.68);font-size:10px}
    .run-hud b{color:#d9f27d}
    .aim-reticle{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.92;filter:drop-shadow(0 1px 3px rgba(0,0,0,.95));will-change:left,top;transition:width .12s ease,height .12s ease}
    .aim-reticle::before,.aim-reticle::after{content:"";position:absolute;background:rgba(238,250,230,.96);border-radius:2px}
    .aim-reticle::before{left:10px;top:1px;width:2px;height:20px}
    .aim-reticle::after{left:1px;top:10px;width:20px;height:2px}
    .aim-reticle i{position:absolute;left:8px;top:8px;width:6px;height:6px;border-radius:50%;background:#d9f27d;box-shadow:0 0 10px rgba(217,242,125,.65)}
    .aim-reticle[data-mode="third"]{width:18px;height:18px}
    .aim-reticle[data-mode="third"]::before{left:8px;height:16px}.aim-reticle[data-mode="third"]::after{top:8px;width:16px}.aim-reticle[data-mode="third"] i{left:6px;top:6px}
    .lab-status{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));max-width:min(720px,calc(100vw - 24px));padding:8px 10px;border:1px solid rgba(255,255,255,.1);background:rgba(4,9,7,.68);font-size:10px;color:#aebbb2}
    .touch{display:none;position:absolute;inset:0;pointer-events:none}
    .joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(64px,calc(env(safe-area-inset-bottom) + 34px));width:112px;height:112px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at 50% 50%,rgba(217,242,125,.05),rgba(7,14,10,.34));pointer-events:auto;touch-action:none}
    .joy::before{content:"↑";position:absolute;left:50%;top:5px;transform:translateX(-50%);color:rgba(217,242,125,.72);font-size:15px;font-weight:800;line-height:1;pointer-events:none}
    .joy::after{content:"MOVE";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:7px;letter-spacing:.16em;pointer-events:none}
    .stick{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(217,242,125,.3);border:1px solid rgba(217,242,125,.65);box-shadow:0 0 18px rgba(217,242,125,.08);will-change:transform}
    .actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(58px,calc(env(safe-area-inset-bottom) + 28px));display:grid;grid-template-columns:repeat(2,72px);gap:10px;pointer-events:auto}
    .actions button{height:54px;border-radius:18px;background:rgba(7,14,10,.62)}
    .actions .fire{grid-row:span 2;height:118px;border-radius:36px;border-color:rgba(217,242,125,.5);background:rgba(115,142,54,.34)}
    .game-over{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,7,5,.78);backdrop-filter:blur(8px);pointer-events:auto}
    .game-over[data-visible="true"]{display:grid}
    .game-over-card{width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid rgba(255,255,255,.14);background:rgba(6,12,8,.94);text-align:center}
    .game-over-card small{color:#d9f27d;letter-spacing:.16em}.game-over-card h2{margin:8px 0 10px;font-size:38px}.game-over-card p{color:#aebbb2}.game-over-card button{width:100%;margin-top:10px;background:#d9f27d;color:#12180d;border-color:#d9f27d}
    @media (hover:none),(pointer:coarse){.touch{display:block}.lab-status{bottom:max(12px,env(safe-area-inset-bottom));font-size:8px;max-width:calc(100vw - 24px)}.run-hud{top:52px;gap:3px}.run-hud span{font-size:8px;padding:5px 6px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="lab-ui">
    <div class="lab-badge">FACEFALL // ENGINE NEXT 0.5B.2 AIM</div>
    <div class="run-hud">
      <span>HP <b id="runHp">100</b></span>
      <span>WAVE <b id="runWave">1</b></span>
      <span>KILLS <b id="runKills">0</b></span>
      <span>SCORE <b id="runScore">000000</b></span>
    </div>
    <div class="lab-controls">
      <button id="camTop" data-active="true">TOP</button>
      <button id="camThird" data-active="false">3RD</button>
    </div>
    <div class="aim-reticle" id="aimReticle" data-mode="top" aria-hidden="true"><i></i></div>
    <div class="touch">
      <div class="joy" id="joy"><div class="stick" id="stick"></div></div>
      <div class="actions">
        <button class="fire" id="touchFire">FIRE</button>
        <button id="touchReload">R</button>
        <button id="touchWeapon">WEAP</button>
        <button id="touchCamera">CAM</button>
      </div>
    </div>
    <div class="game-over" id="gameOver" data-visible="false">
      <div class="game-over-card">
        <small>RUN ENDED</small>
        <h2>ТЕБЯ ОКРУЖИЛИ</h2>
        <p id="gameOverStats">WAVE 1 · KILLS 0 · SCORE 0</p>
        <button id="restartRun" type="button">ЕЩЁ РАЗ</button>
      </div>
    </div>
    <div class="lab-status" id="status">Инициализация модульного движка…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
