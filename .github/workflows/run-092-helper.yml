name: Run 0.9.2 Helper

on:
  pull_request:
    paths:
      - '.github/workflows/run-092-helper.yml'
      - '.github/workflows/patch-092-shotgun.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.2-shotgun-production
          fetch-depth: 0
      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'playShotgunFire' src/characters/CharacterModel.ts; then
            echo '0.9.2 implementation already applied'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/patch-092-shotgun.yml').read_text('utf-8')
          start=text.index('      - name: Implement shotgun production slice')
          run=text.index('        run: |\n', start) + len('        run: |\n')
          end=text.index('\n      - name: Commit shotgun slice', run)
          block=text[run:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-092.sh').write_text('\n'.join(lines)+'\n','utf-8')
          PY
          bash /tmp/apply-092.sh
          git config user.name 'facefall-shotgun-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/characters/WeaponSocketVisual.ts src/characters/CharacterModel.ts src/player/PlayerRuntime.ts tests/unit/animation-library.test.ts tests/smoke/visual-regression.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m '0.9.2: add production shotgun slice'
          git push origin HEAD:visual/0.9.2-shotgun-production
