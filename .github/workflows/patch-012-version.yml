name: Patch 012 Version
on:
  push:
    branches: ['feature/0.12.0-super-makar-family']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update version metadata
        run: |
          sed -i 's/0.11.0-alpha.0/0.12.0-alpha.0/g' package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-012-version.yml
          git add package.json package-lock.json
          git commit -m 'chore: bump Super Makar to 0.12.0-alpha.0'
          git push origin HEAD:feature/0.12.0-super-makar-family
