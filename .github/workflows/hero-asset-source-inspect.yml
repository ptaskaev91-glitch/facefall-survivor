name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve official Quaternius free download page
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          PURCHASE='https://quaternius.itch.io/universal-base-characters/purchase'
          ENDPOINT='https://quaternius.itch.io/universal-base-characters/download_url'

          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html

          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib
          import re
          text = Path('/tmp/purchase.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I)
          if not match:
              match = re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match:
              raise SystemExit('csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"

          curl -fsS --compressed -A "$UA" \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' \
            --data-urlencode "csrf_token=$CSRF" \
            --data-urlencode 'reward_id=' \
            "$ENDPOINT" -o /tmp/download-url.json

          DOWNLOAD_PAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/download-url.json').read_text('utf-8'))
          url = data.get('url')
          if not url:
              raise SystemExit(f'no download URL in response: {sorted(data)}')
          print(url)
          PY
          )"

          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt "$DOWNLOAD_PAGE" -o /tmp/download.html

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re

          text = Path('/tmp/download.html').read_text('utf-8', errors='replace')

          class Parser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'script' and data.get('src'):
                      parts = urlsplit(data['src'])
                      print('script:', f'{parts.scheme}://{parts.netloc}{parts.path}')
                  if tag != 'a':
                      return
                  href = data.get('href')
                  upload_id = data.get('data-upload_id') or data.get('data-upload-id')
                  if not href and not upload_id:
                      return
                  parts = urlsplit(href or '')
                  safe_href = f'{parts.scheme}://{parts.netloc}{parts.path}' if parts.scheme else parts.path
                  if upload_id:
                      print(f'file-link: upload_id={upload_id!r} href={safe_href!r}')

          Parser().feed(text)
          for needle in ('15861669', 'download_btn', 'upload_id', 'uploadId'):
              match = re.search(re.escape(needle), text, re.I)
              if not match:
                  continue
              start = max(0, match.start() - 900)
              end = min(len(text), match.end() + 1800)
              snippet = re.sub(r'([?&](?:key|token|download_key)=)[^&"\']+', r'\1[redacted]', text[start:end], flags=re.I)
              print(f'--- context {needle} ---')
              print(snippet.replace('\n', ' '))
          PY
