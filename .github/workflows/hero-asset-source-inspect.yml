name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: write

jobs:
  vendor-animation-library:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.0-hero-glb-spike
          fetch-depth: 0
      - name: Download verified official animation library
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'; SLUG='universal-animation-library'; BASE="https://quaternius.itch.io/$SLUG"; PURCHASE="$BASE/purchase"; UPLOAD='17958403'
          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html
          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as h,re
          s=Path('/tmp/purchase.html').read_text('utf-8',errors='replace'); m=re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',s,re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',s,re.I); print(h.unescape(m.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF" --data-urlencode 'reward_id=' "$BASE/download_url" -o /tmp/download-url.json
          PAGE="$(python3 -c "import json; print(json.load(open('/tmp/download-url.json'))['url'])")"
          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt "$PAGE" -o /tmp/download.html
          CSRF2="$(python3 - <<'PY'
          from pathlib import Path
          import html as h,re
          s=Path('/tmp/download.html').read_text('utf-8',errors='replace'); m=re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',s,re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',s,re.I); print(h.unescape(m.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -e "$PAGE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF2" "$BASE/file/$UPLOAD?source=game_download" -o /tmp/file.json
          FILE="$(python3 -c "import json; print(json.load(open('/tmp/file.json'))['url'])")"
          curl -fL --retry 3 -A "$UA" "$FILE" -o /tmp/ual.zip
          echo 'cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724  /tmp/ual.zip' | sha256sum -c -
      - name: Extract non-root-motion GLB and inspect clips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,struct
          from pathlib import Path
          out=Path('public/assets/animations/quaternius-universal-animation-library'); out.mkdir(parents=True,exist_ok=True)
          root='Universal Animation Library[Standard]/'
          with zipfile.ZipFile('/tmp/ual.zip') as z:
              for src,dst in [(root+'Unreal-Godot/UAL1_Standard.glb','UAL1_Standard.glb'),(root+'License.txt','License.txt'),(root+'README.txt','README.txt')]: (out/dst).write_bytes(z.read(src))
          data=(out/'UAL1_Standard.glb').read_bytes(); magic,version,total=struct.unpack_from('<III',data,0); length,ctype=struct.unpack_from('<II',data,12); doc=json.loads(data[20:20+length].decode('utf-8').rstrip('\x00 \t\r\n'))
          nodes=doc.get('nodes',[]); print('GLB',hex(magic),version,total,'animations',len(doc.get('animations',[])),'nodes',len(nodes))
          for a in doc.get('animations',[]):
              name=a.get('name','');
              if any(k in name.lower() for k in ('idle','walk','run','sprint','jog')): print('CLIP',name,'channels',len(a.get('channels',[])))
          (out/'ASSET_SOURCE.md').write_text('''# Quaternius Universal Animation Library — runtime locomotion\n\n- Source: Quaternius, **Universal Animation Library** (Standard pack)\n- Official itch page: https://quaternius.itch.io/universal-animation-library\n- itch upload id: `17958403`\n- Original archive SHA-256: `cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724`\n- Runtime file: `Unreal-Godot/UAL1_Standard.glb`\n- Variant: **non-root-motion**, intentionally selected because Facefall movement remains authoritative in `PlayerRuntime`/physics.\n- License/readme are retained verbatim.\n''',encoding='utf-8')
          PY
      - name: Commit verified animation asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-asset-bot'; git config user.email 'actions@users.noreply.github.com'
          git add public/assets/animations/quaternius-universal-animation-library
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '0.9.0: vendor verified Quaternius locomotion library'
          git push origin HEAD:visual/0.9.0-hero-glb-spike
