name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Quaternius public download page
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          curl -fsSL --compressed -A "$UA" \
            'https://quaternius.itch.io/universal-base-characters/purchase' \
            -o /tmp/quaternius-purchase.html
          curl -fsSL --compressed -A "$UA" \
            'https://static.itch.io/checkout.min.js' \
            -o /tmp/checkout.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/quaternius-purchase.html').read_text('utf-8', errors='replace')
          js = Path('/tmp/checkout.js').read_text('utf-8', errors='replace')

          for label, source, needles in (
              ('html', html, ('No thanks', 'Standard].zip')),
              ('checkout-js', js, ('prototype.direct_download=function', 'direct_download=function', 'download_url=function')),
          ):
              for needle in needles:
                  match = re.search(re.escape(needle), source, re.I)
                  if not match:
                      continue
                  start = max(0, match.start() - 900)
                  end = min(len(source), match.end() + 1800)
                  snippet = source[start:end]
                  snippet = re.sub(r'value=["\'][^"\']{20,}["\']', 'value="[redacted]"', snippet, flags=re.I)
                  print(f'--- {label} context {needle} ---')
                  print(snippet.replace('\n', ' '))

          print(f'html-bytes: {len(html.encode("utf-8"))}')
          print(f'checkout-js-bytes: {len(js.encode("utf-8"))}')
          PY
