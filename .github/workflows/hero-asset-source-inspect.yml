name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official Quaternius male hero glTF
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          PURCHASE='https://quaternius.itch.io/universal-base-characters/purchase'
          DOWNLOAD_URL_ENDPOINT='https://quaternius.itch.io/universal-base-characters/download_url'
          FILE_ENDPOINT='https://quaternius.itch.io/universal-base-characters/file/15861669?source=game_download'
          ARCHIVE='/tmp/universal-base-characters-standard.zip'

          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html
          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib, re
          text = Path('/tmp/purchase.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match: raise SystemExit('csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF" --data-urlencode 'reward_id=' "$DOWNLOAD_URL_ENDPOINT" -o /tmp/download-url.json
          DOWNLOAD_PAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/download-url.json').read_text()); print(data['url'])
          PY
          )"
          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt "$DOWNLOAD_PAGE" -o /tmp/download.html
          CSRF_DOWNLOAD="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib, re
          text = Path('/tmp/download.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match: raise SystemExit('download csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$DOWNLOAD_PAGE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF_DOWNLOAD" "$FILE_ENDPOINT" -o /tmp/file-url.json
          FILE_URL="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/file-url.json').read_text()); print(data['url'])
          PY
          )"
          curl -fL --retry 3 --retry-delay 2 -A "$UA" "$FILE_URL" -o "$ARCHIVE"

          python3 - <<'PY'
          import json, zipfile
          from pathlib import PurePosixPath

          archive='/tmp/universal-base-characters-standard.zip'
          prefix='Universal Base Characters[Standard]/Base Characters/Godot - UE/'
          model=prefix+'Superhero_Male_FullBody.gltf'
          with zipfile.ZipFile(archive) as zf:
              gltf=json.loads(zf.read(model).decode('utf-8'))
              print('asset:', gltf.get('asset'))
              print('scene:', gltf.get('scene'), 'scenes:', gltf.get('scenes'))
              print('extensionsUsed:', gltf.get('extensionsUsed'))
              print('extensionsRequired:', gltf.get('extensionsRequired'))
              print('animations:', [a.get('name') for a in gltf.get('animations',[])])
              print('buffers:', gltf.get('buffers'))
              print('images:', gltf.get('images'))
              print('textures:', gltf.get('textures'))
              print('materials:')
              for i,m in enumerate(gltf.get('materials',[])):
                  pbr=m.get('pbrMetallicRoughness',{})
                  print(i, m.get('name'), 'baseColorTexture=', pbr.get('baseColorTexture'), 'normal=', m.get('normalTexture'), 'roughMetal=', pbr.get('metallicRoughnessTexture'), 'alphaMode=', m.get('alphaMode'))
              print('skins:')
              nodes=gltf.get('nodes',[])
              for i,s in enumerate(gltf.get('skins',[])):
                  joints=s.get('joints',[])
                  print(i, s.get('name'), 'skeleton=', s.get('skeleton'), 'jointCount=', len(joints))
                  print(' jointNames=', [nodes[j].get('name') for j in joints])
              print('nodes:')
              for i,n in enumerate(nodes):
                  if any(k in n for k in ('mesh','skin','camera')) or n.get('name'):
                      print(i, n.get('name'), 'mesh=', n.get('mesh'), 'skin=', n.get('skin'), 'children=', n.get('children'))
              print('meshes/primitives:')
              accessors=gltf.get('accessors',[])
              for mi,m in enumerate(gltf.get('meshes',[])):
                  print('mesh', mi, m.get('name'))
                  for pi,p in enumerate(m.get('primitives',[])):
                      pos=p.get('attributes',{}).get('POSITION')
                      idx=p.get('indices')
                      pos_count=accessors[pos].get('count') if pos is not None else None
                      idx_count=accessors[idx].get('count') if idx is not None else None
                      attrs=sorted(p.get('attributes',{}))
                      print(' primitive', pi, 'material=', p.get('material'), 'vertices=', pos_count, 'indices=', idx_count, 'attrs=', attrs)
              print('--- dependencies ---')
              uris=[]
              for section in ('buffers','images'):
                  for item in gltf.get(section,[]):
                      uri=item.get('uri')
                      if uri: uris.append(uri)
              for uri in uris:
                  full=prefix+uri
                  info=zf.getinfo(full)
                  print(info.file_size, uri)
              print('--- license ---')
              print(zf.read('Universal Base Characters[Standard]/License_Standard.txt').decode('utf-8', errors='replace'))
          PY
