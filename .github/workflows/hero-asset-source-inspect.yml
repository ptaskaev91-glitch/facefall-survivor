name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Locate itch upload-download endpoint builder
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          curl -fsSL --compressed -A "$UA" 'https://static.itch.io/extern.min.js' -o /tmp/extern.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/extern.js').read_text('utf-8', errors='replace')
          print('extern-bytes:', len(source.encode('utf-8')))

          patterns = (
              r'Yt\s*=', r'function\s+Yt\s*\(', r'Yt=function',
              r'generate_download', r'upload_id', r'game_download'
          )
          for pattern in patterns:
              matches = list(re.finditer(pattern, source, re.I))
              print(f'pattern {pattern!r}: {len(matches)} matches')
              for match in matches[:6]:
                  start = max(0, match.start() - 1800)
                  end = min(len(source), match.end() + 3200)
                  snippet = source[start:end]
                  snippet = re.sub(r'([?&](?:key|token|download_key)=)[^&"\']+', r'\1[redacted]', snippet, flags=re.I)
                  print(f'--- context {pattern} @ {match.start()} ---')
                  print(snippet.replace('\n', ' '))
          PY
