name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Quaternius public download page
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          curl -fsSL --compressed -A "$UA" \
            'https://quaternius.itch.io/universal-base-characters/purchase' \
            -o /tmp/quaternius-purchase.html
          curl -fsSL --compressed -A "$UA" \
            'https://static.itch.io/checkout.min.js' \
            -o /tmp/checkout.js

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import re

          html = Path('/tmp/quaternius-purchase.html').read_text('utf-8', errors='replace')
          js = Path('/tmp/checkout.js').read_text('utf-8', errors='replace')
          base = 'https://quaternius.itch.io/universal-base-characters/purchase'

          class Parser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag in {'a', 'form', 'script'}:
                      target = data.get('href') or data.get('action') or data.get('src')
                      if target:
                          print(f'{tag}-target: {urljoin(base, target)}')
                  if tag in {'input', 'button'}:
                      name = data.get('name')
                      kind = data.get('type')
                      value = data.get('value') if kind in {'submit', 'button'} else None
                      print(f'control: tag={tag} name={name!r} type={kind!r} submit-value={value!r}')

          Parser().feed(html)

          for label, source, needles in (
              ('html', html, ('No thanks', 'Standard].zip', 'skip_payment')),
              ('checkout-js', js, ('direct_download_btn', 'skip_payment', 'download_url', '/download')),
          ):
              for needle in needles:
                  match = re.search(re.escape(needle), source, re.I)
                  if not match:
                      continue
                  start = max(0, match.start() - 550)
                  end = min(len(source), match.end() + 900)
                  snippet = source[start:end]
                  snippet = re.sub(r'value=["\'][^"\']{20,}["\']', 'value="[redacted]"', snippet, flags=re.I)
                  print(f'--- {label} context {needle} ---')
                  print(snippet.replace('\n', ' '))

          print(f'html-bytes: {len(html.encode("utf-8"))}')
          print(f'checkout-js-bytes: {len(js.encode("utf-8"))}')
          PY
