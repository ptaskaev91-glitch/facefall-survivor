name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-public-download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inventory official Quaternius Standard pack
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          PURCHASE='https://quaternius.itch.io/universal-base-characters/purchase'
          DOWNLOAD_URL_ENDPOINT='https://quaternius.itch.io/universal-base-characters/download_url'
          FILE_ENDPOINT='https://quaternius.itch.io/universal-base-characters/file/15861669?source=game_download'

          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html

          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib
          import re
          text = Path('/tmp/purchase.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I)
          if not match:
              match = re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match:
              raise SystemExit('csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"

          curl -fsS --compressed -A "$UA" \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' \
            --data-urlencode "csrf_token=$CSRF" \
            --data-urlencode 'reward_id=' \
            "$DOWNLOAD_URL_ENDPOINT" -o /tmp/download-url.json

          DOWNLOAD_PAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/download-url.json').read_text('utf-8'))
          url = data.get('url')
          if not url:
              raise SystemExit(f'no download URL in response: {sorted(data)}')
          print(url)
          PY
          )"
          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt "$DOWNLOAD_PAGE" -o /tmp/download.html

          CSRF_DOWNLOAD="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib
          import re
          text = Path('/tmp/download.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I)
          if not match:
              match = re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match:
              raise SystemExit('download-page csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"

          curl -fsS --compressed -A "$UA" \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -e "$DOWNLOAD_PAGE" -H 'X-Requested-With: XMLHttpRequest' \
            --data-urlencode "csrf_token=$CSRF_DOWNLOAD" \
            "$FILE_ENDPOINT" -o /tmp/file-url.json

          FILE_URL="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/file-url.json').read_text('utf-8'))
          if data.get('errors'):
              raise SystemExit('file endpoint errors: ' + '; '.join(map(str, data['errors'])))
          url = data.get('url')
          if not url:
              raise SystemExit(f'no file URL in response: {sorted(data)}')
          print(url)
          PY
          )"

          curl -fL --retry 3 --retry-delay 2 -A "$UA" "$FILE_URL" -o /tmp/universal-base-characters-standard.zip
          file /tmp/universal-base-characters-standard.zip
          du -h /tmp/universal-base-characters-standard.zip
          sha256sum /tmp/universal-base-characters-standard.zip

          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import re

          archive = Path('/tmp/universal-base-characters-standard.zip')
          with zipfile.ZipFile(archive) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              print('zip-files:', len(infos))
              print('zip-uncompressed-mib:', round(sum(i.file_size for i in infos) / 1024 / 1024, 2))

              exts = {}
              for info in infos:
                  ext = Path(info.filename).suffix.lower() or '[none]'
                  exts[ext] = exts.get(ext, 0) + 1
              print('extensions:', sorted(exts.items(), key=lambda kv: (-kv[1], kv[0])))

              interesting = [i for i in infos if Path(i.filename).suffix.lower() in {'.gltf', '.glb', '.bin', '.fbx', '.obj', '.png', '.jpg', '.jpeg', '.txt', '.md'}]
              print('interesting-files:', len(interesting))
              for info in interesting[:400]:
                  print(f'{info.file_size:>10}  {info.filename}')

              print('--- likely male/base character candidates ---')
              candidates = [i for i in interesting if re.search(r'(male|man|base|regular|character)', i.filename, re.I)]
              for info in candidates[:250]:
                  print(f'{info.file_size:>10}  {info.filename}')
          PY
