name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: write

jobs:
  vendor-official-hero:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.0-hero-glb-spike
          fetch-depth: 0

      - name: Download verified official Quaternius Standard pack
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          PURCHASE='https://quaternius.itch.io/universal-base-characters/purchase'
          DOWNLOAD_URL_ENDPOINT='https://quaternius.itch.io/universal-base-characters/download_url'
          FILE_ENDPOINT='https://quaternius.itch.io/universal-base-characters/file/15861669?source=game_download'
          ARCHIVE='/tmp/universal-base-characters-standard.zip'

          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html
          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib, re
          text = Path('/tmp/purchase.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match: raise SystemExit('csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF" --data-urlencode 'reward_id=' "$DOWNLOAD_URL_ENDPOINT" -o /tmp/download-url.json
          DOWNLOAD_PAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/download-url.json').read_text()); print(data['url'])
          PY
          )"
          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt "$DOWNLOAD_PAGE" -o /tmp/download.html
          CSRF_DOWNLOAD="$(python3 - <<'PY'
          from pathlib import Path
          import html as html_lib, re
          text = Path('/tmp/download.html').read_text('utf-8', errors='replace')
          match = re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)', text, re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']', text, re.I)
          if not match: raise SystemExit('download csrf meta not found')
          print(html_lib.unescape(match.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$DOWNLOAD_PAGE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF_DOWNLOAD" "$FILE_ENDPOINT" -o /tmp/file-url.json
          FILE_URL="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/file-url.json').read_text()); print(data['url'])
          PY
          )"
          curl -fL --retry 3 --retry-delay 2 -A "$UA" "$FILE_URL" -o "$ARCHIVE"
          echo 'fdbf1804c90dfc1ea03e992bff7da2dfd1a79318e13270a660180f9308455f40  /tmp/universal-base-characters-standard.zip' | sha256sum -c -

      - name: Extract only the male runtime asset and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          archive=Path('/tmp/universal-base-characters-standard.zip')
          out=Path('public/assets/characters/quaternius-universal-base-male')
          out.mkdir(parents=True, exist_ok=True)
          prefix='Universal Base Characters[Standard]/Base Characters/Godot - UE/'
          selected=[
              'Superhero_Male_FullBody.gltf',
              'Superhero_Male_FullBody.bin',
              'T_Hair_1_Normal.png',
              'T_Hair_1_BaseColor.png',
              'T_Eye_Normal.png',
              'T_Eye_Brown.png',
              'T_Superhero_Male_Normal.png',
              'T_Superhero_Male_Dark.png',
              'T_Superhero_Male_Roughness.png',
          ]
          with zipfile.ZipFile(archive) as zf:
              for name in selected:
                  data=zf.read(prefix+name)
                  (out/name).write_bytes(data)
              license_bytes=zf.read('Universal Base Characters[Standard]/License_Standard.txt')
              (out/'License_Standard.txt').write_bytes(license_bytes)

          gltf_path=out/'Superhero_Male_FullBody.gltf'
          gltf=json.loads(gltf_path.read_text('utf-8'))
          uri_fixes={
              'T_Hair_1_Normal_png.png':'T_Hair_1_Normal.png',
              'T_Eye_Normal_png.png':'T_Eye_Normal.png',
          }
          for image in gltf.get('images',[]):
              uri=image.get('uri')
              if uri in uri_fixes:
                  image['uri']=uri_fixes[uri]
          gltf_path.write_text(json.dumps(gltf, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          source=(out/'ASSET_SOURCE.md')
          source.write_text('''# Quaternius Universal Base Characters — male runtime asset\n\n- Source: Quaternius, **Universal Base Characters** (Standard pack)\n- Official page: https://quaternius.com/packs/universalbasecharacters.html\n- Official itch page: https://quaternius.itch.io/universal-base-characters\n- Downloaded official file: `Universal Base Characters[Standard].zip`\n- itch upload id: `15861669`\n- Original archive SHA-256: `fdbf1804c90dfc1ea03e992bff7da2dfd1a79318e13270a660180f9308455f40`\n- Runtime source model: `Base Characters/Godot - UE/Superhero_Male_FullBody.gltf`\n- License: CC0; verbatim pack license is retained as `License_Standard.txt`.\n\n## Local compatibility patch\n\nThe upstream glTF references two PNG URIs with `_png` duplicated in the file name, while the Standard archive contains the files without that suffix. The vendored glTF changes only those two image URIs:\n\n- `T_Hair_1_Normal_png.png` → `T_Hair_1_Normal.png`\n- `T_Eye_Normal_png.png` → `T_Eye_Normal.png`\n\nNo geometry, skeleton, UV, material, or texture data is otherwise modified.\n''', encoding='utf-8')
          PY

      - name: Commit verified runtime asset to spike branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/characters/quaternius-universal-base-male
          if git diff --cached --quiet; then
            echo 'Asset already vendored; nothing to commit.'
            exit 0
          fi
          git commit -m '0.9.0: vendor verified Quaternius male hero asset'
          git push origin HEAD:visual/0.9.0-hero-glb-spike
