name: Hero Asset Source Inspect

on:
  pull_request:
    paths:
      - '.github/workflows/hero-asset-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-animation-library:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inventory official Universal Animation Library
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 FacefallAssetAudit/1.0'
          SLUG='universal-animation-library'
          BASE="https://quaternius.itch.io/$SLUG"
          PURCHASE="$BASE/purchase"
          UPLOAD='17958403'
          curl -fsSL --compressed -A "$UA" -c /tmp/cookies.txt "$PURCHASE" -o /tmp/purchase.html
          CSRF="$(python3 - <<'PY'
          from pathlib import Path
          import html as h,re
          s=Path('/tmp/purchase.html').read_text('utf-8',errors='replace')
          m=re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',s,re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',s,re.I)
          if not m: raise SystemExit('csrf missing')
          print(h.unescape(m.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt -e "$PURCHASE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF" --data-urlencode 'reward_id=' "$BASE/download_url" -o /tmp/download-url.json
          PAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/download-url.json').read_text())['url'])
          PY
          )"
          curl -fsSL --compressed -A "$UA" -b /tmp/cookies.txt -c /tmp/cookies.txt "$PAGE" -o /tmp/download.html
          CSRF2="$(python3 - <<'PY'
          from pathlib import Path
          import html as h,re
          s=Path('/tmp/download.html').read_text('utf-8',errors='replace')
          m=re.search(r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',s,re.I) or re.search(r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',s,re.I)
          if not m: raise SystemExit('csrf missing')
          print(h.unescape(m.group(1)))
          PY
          )"
          curl -fsS --compressed -A "$UA" -b /tmp/cookies.txt -e "$PAGE" -H 'X-Requested-With: XMLHttpRequest' --data-urlencode "csrf_token=$CSRF2" "$BASE/file/$UPLOAD?source=game_download" -o /tmp/file.json
          FILE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/file.json').read_text())['url'])
          PY
          )"
          curl -fL --retry 3 -A "$UA" "$FILE" -o /tmp/ual.zip
          file /tmp/ual.zip
          du -h /tmp/ual.zip
          sha256sum /tmp/ual.zip
          python3 - <<'PY'
          import zipfile,re
          from pathlib import Path
          with zipfile.ZipFile('/tmp/ual.zip') as z:
              files=[i for i in z.infolist() if not i.is_dir()]
              print('files',len(files),'uncompressedMiB',round(sum(i.file_size for i in files)/1048576,2))
              for i in files:
                  n=i.filename
                  if re.search(r'(idle|walk|run|sprint|jog|license|readme)',n,re.I) or Path(n).suffix.lower() in {'.gltf','.glb'}:
                      print(i.file_size,n)
          PY
