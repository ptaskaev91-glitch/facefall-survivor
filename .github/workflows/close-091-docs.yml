name: Close 0.9.1 Docs

on:
  pull_request:
    paths:
      - '.github/workflows/close-091-docs.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.1-pistol-animation
          fetch-depth: 0
      - name: Patch 0.9.1 checkpoint docs and lock metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def patch(path, changes):
              p=Path(path); text=p.read_text('utf-8')
              for old,new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:90]!r}')
                  text=text.replace(old,new,1)
              p.write_text(text,'utf-8')

          patch('dev.md', [
            ('Source of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`','Source of truth: `visual/0.9.1-pistol-animation` until PR #21 merge, then `main`'),
            ('Текущий активный visual checkpoint: **0.9.0 HERO VERTICAL SLICE — rigged GLTF + animation + uploaded face + pistol socket**.','Текущий активный visual checkpoint: **0.9.1 PISTOL COMBAT ANIMATION — real FIRE/R events + one-shot overrides + mobile visual gate**.'),
            ('- [x] `mobile-face-front.png` with a synthetic uploaded face for head-bone inspection;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;','- [x] `mobile-face-front.png` with a synthetic uploaded face for head-bone inspection;\n- [x] `mobile-pistol-fire-third.png` after real held touch FIRE;\n- [x] `mobile-pistol-reload-front.png` during real touch reload state;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;'),
            ('- [ ] pistol aim/fire/reload;','- [~] pistol aim foundation + [x] fire/reload one-shot animation overrides bound to actual combat events;'),
            ('After the 0.9.0 hero vertical slice merge:\n\n1. **Pistol fire/reload animation integration** from the vendored CC0 library.\n2. Finalize production pistol art only if a GLB materially improves the current readable socket visual.\n3. Expand production weapon visuals/sockets to shotgun and bow.\n4. Replace Walker with the first production infected asset, then Runner/Brute.','After the 0.9.1 pistol-animation merge:\n\n1. **Shotgun production visual/socket + fire/reload animation**.\n2. Bow production visual/socket + draw/release animation.\n3. Replace Walker with the first production infected asset, then Runner/Brute.\n4. Return to Face System crop/fitting polish after the core weapon silhouettes are production-ready.'),
            ('- [ ] package-lock root metadata version can be refreshed at the next dependency-lock regeneration; dependency graph itself remains locked and `npm ci` passes.','- [x] package-lock root metadata version is kept aligned with package.json at checkpoints; dependency graph remains locked and `npm ci` passes.')
          ])

          patch('structure.md', [
            ('Source of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`','Source of truth: `visual/0.9.1-pistol-animation` until PR #21 merge, then `main`'),
            ('Architecture checkpoint: **0.9.0 HERO VERTICAL SLICE**','Architecture checkpoint: **0.9.1 PISTOL COMBAT ANIMATION**'),
            ('│       ├── health-damage.test.ts\n│       ├── weapon-system.test.ts','│       ├── animation-library.test.ts\n│       ├── health-damage.test.ts\n│       ├── weapon-system.test.ts'),
            ('- production pistol socket and muzzle world transform;','- production pistol socket and muzzle world transform;\n- combat-event → hero one-shot animation bridge for pistol fire/reload;\n- active-weapon visibility/muzzle guard so pistol visuals cannot leak into shotgun/bow gameplay;')
          ])

          hp=Path('history.md'); h=hp.read_text('utf-8')
          if '# 21. 0.9.1 — pistol combat animation integration' not in h:
              marker='\n# 21. How to continue this file\n'
              section='''\n# 21. 0.9.1 — pistol combat animation integration\n\nPR #21 on `visual/0.9.1-pistol-animation` connected the production hero animation layer to actual combat events instead of decorative playback.\n\nImplemented:\n\n- `CharacterModel` gained temporary one-shot animation overrides above locomotion and clean return to the current idle/walk/run state;\n- actual player `shot` events trigger the pistol fire clip;\n- actual `weaponReload` events trigger the pistol reload clip;\n- a GLB asset-contract unit test reads the vendored `UAL1_Standard.glb` and verifies compatible pistol fire/reload clips exist;\n- `PlayerRuntime` tracks the active weapon, hides the pistol when shotgun/bow is selected and uses production muzzle position only for pistol;\n- mobile visual smoke now models FIRE as a true held pointer action (`pointerdown` across fixed updates) and validates ammo consumption, cooldown, reload state and animation screenshots;\n- the test found that instantaneous synthetic `tap()` is not equivalent to Facefall's held FIRE semantics; the test was corrected rather than weakening production input behavior;\n- stale build text in `Bootstrap.markBuildUi()` was fixed so runtime no longer rewrites the UI back to 0.8.5;\n- deployment-root CI was made version-independent: production `index.html` must be byte-identical to the compiled `engine-lab.html`, instead of grepping for a hard-coded 0.8 string.\n\nVisual review confirmed distinct pistol fire and reload poses while the uploaded face remains attached to the animated head.\n\nNext ordered work: shotgun production visual/socket + animation, then bow draw/release, then production infected.\n\n---\n'''
              h=h.replace(marker,section+'\n# 22. How to continue this file\n',1)
          hp.write_text(h,'utf-8')

          lock=Path('package-lock.json'); data=json.loads(lock.read_text('utf-8'))
          data['version']='0.9.1-alpha.0'; data['packages']['']['version']='0.9.1-alpha.0'
          lock.write_text(json.dumps(data,indent=2)+'\n','utf-8')
          PY
      - name: Commit checkpoint docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dev.md history.md structure.md package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m '0.9.1: record pistol animation checkpoint'
          git push origin HEAD:visual/0.9.1-pistol-animation
