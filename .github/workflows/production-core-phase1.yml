name: Production Core Phase 1

on:
  push:
    branches:
      - milestone/0.10.0-production-core
    paths:
      - .github/workflows/production-core-phase1.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.10.0-production-core
      - run: python3 scripts/phase1-production-core.py
      - run: |
          npm ci
          npm run typecheck
          npm run test:unit
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/CombatRuntime.ts src/app/RunSession.ts src/app/GameApp.ts src/player/PlayerRuntime.ts src/characters/CharacterModel.ts tests/unit/run-session.test.ts
          git rm .github/workflows/production-core-phase1.yml scripts/phase1-production-core.py
          git commit -m "0.10.0: extract CombatRuntime and RunSession"
          git push origin HEAD:milestone/0.10.0-production-core
