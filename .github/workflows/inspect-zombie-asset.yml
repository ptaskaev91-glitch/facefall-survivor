name: Vendor CC0 Zombie Asset

on:
  push:
    branches:
      - visual/0.9.4-rigged-infected
    paths:
      - .github/workflows/inspect-zombie-asset.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.4-rigged-infected
      - name: Vendor pinned Mesh2Motion zombie and provenance
        run: |
          set -euo pipefail
          target="public/assets/enemies/mesh2motion-human-zombie"
          mkdir -p "$target"
          curl -fsSL "https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/c1897f21957d3bb24f59b0ea191f810cefcbff38/static/models-variation/human-zombie.glb" -o "$target/human-zombie.glb"
          test "$(wc -c < "$target/human-zombie.glb")" -eq 162820
          echo "ad2102eda5bcb460ccd02b6dad3356075657276e9dd1c4b89c6b83a84163fc0d  $target/human-zombie.glb" | sha256sum -c -
          cat > "$target/PROVENANCE.md" <<'EOF'
          # Mesh2Motion human-zombie provenance

          - Asset: `human-zombie.glb`
          - Upstream repository: `Mesh2Motion/mesh2motion-app`
          - Upstream commit: `c1897f21957d3bb24f59b0ea191f810cefcbff38`
          - Upstream path: `static/models-variation/human-zombie.glb`
          - Upstream Git blob SHA: `14ea7e8de466bac56adaf3f3b2b08c7309b387f5`
          - Byte size: `162820`
          - SHA-256: `ad2102eda5bcb460ccd02b6dad3356075657276e9dd1c4b89c6b83a84163fc0d`
          - License: CC0. Mesh2Motion's README states that its art assets (3D models, rigs and animations) are all CC0; the upstream repository also contains `LICENSE-CC0.MD`.
          - Upstream project: https://github.com/Mesh2Motion/mesh2motion-app

          Vendored unchanged for the Facefall Survivor 0.9.4 infected-character vertical slice.
          EOF
          rm .github/workflows/inspect-zombie-asset.yml
      - name: Commit vendored asset and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/enemies/mesh2motion-human-zombie .github/workflows/inspect-zombie-asset.yml
          git commit -m "0.9.4: vendor CC0 zombie mesh"
          git push origin HEAD:visual/0.9.4-rigged-infected
