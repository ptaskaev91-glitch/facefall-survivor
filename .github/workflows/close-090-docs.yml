name: Close 0.9.0 Docs

on:
  pull_request:
    paths:
      - '.github/workflows/close-090-docs.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.0-hero-glb-spike
          fetch-depth: 0

      - name: Patch checkpoint docs and lock metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text('utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), 'utf-8')

          replace(
              'dev.md',
              'Последняя актуализация: **2026-08-12**  \nRepository: `ptaskaev91-glitch/facefall-survivor`  \nSource of truth: `main` after merge of the active hardening PR  ',
              'Последняя актуализация: **2026-08-13**  \nRepository: `ptaskaev91-glitch/facefall-survivor`  \nSource of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`  '
          )
          replace(
              'dev.md',
              'Текущий стабильный gameplay checkpoint до этого блока: **0.8.4 COMBAT + HUMANOID INFECTED**.  \nТекущий активный checkpoint: **0.8.5–0.8.7 HARDENING — repo hygiene + tests + GameApp decomposition**.',
              'Текущий стабильный architecture checkpoint: **0.8.5–0.8.7 HARDENING**.  \nТекущий активный visual checkpoint: **0.9.0 HERO VERTICAL SLICE — rigged GLTF + animation + uploaded face + pistol socket**.'
          )
          replace(
              'dev.md',
              'Future tests after new systems appear:\n\n- [ ] Character animation state transitions;',
              'Future tests after new systems appear:\n\n- [x] Character locomotion state transitions (pure idle/walk/run resolver);'
          )
          replace(
              'dev.md',
              '- [x] `mobile-third.png` after camera switch;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;',
              '- [x] `mobile-third.png` after camera switch;\n- [x] `mobile-face-front.png` with a synthetic uploaded face for head-bone inspection;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;'
          )

          old_hero = '''## 8.1 Hero production pipeline\n\n- [ ] choose/license production-direction humanoid GLB;\n- [ ] inspect skeleton/bones/scale/materials;\n- [ ] clone skinned meshes correctly (`SkeletonUtils` where needed);\n- [ ] CharacterModel wrapper lives behind PlayerRuntime;\n- [ ] head/face-compatible UV or dedicated face surface;\n- [ ] weapon hand sockets;\n- [ ] LOD/asset budget.\n\n## 8.2 Hero animation\n\n- [ ] AnimationMixer;\n- [ ] idle;\n- [ ] walk;\n- [ ] run;'''
          new_hero = '''## 8.1 Hero production pipeline\n\n- [x] choose/license production-direction humanoid GLB — Quaternius Universal Base Characters, CC0;\n- [x] inspect skeleton/bones/scale/materials — 65-bone humanoid, real `Head` / `hand_r` sockets;\n- [x] clone skinned meshes correctly with `SkeletonUtils`;\n- [x] `CharacterModel` wrapper lives behind `PlayerRuntime`;\n- [x] dedicated curved uploaded-face surface attached to real `Head` bone;\n- [x] weapon hand/socket foundation;\n- [x] skeleton-height scale normalization + feet grounding;\n- [ ] LOD/initial-download asset budget optimization.\n\n## 8.2 Hero animation\n\n- [x] AnimationMixer;\n- [x] idle;\n- [x] walk;\n- [x] run;'''
          replace('dev.md', old_hero, new_hero)
          replace(
              'dev.md',
              '- [ ] state machine/crossfades;\n- [ ] animation state unit tests where state logic is pure.',
              '- [x] locomotion state resolver + crossfades;\n- [x] animation state unit tests where state logic is pure.'
          )
          replace(
              'dev.md',
              '## 8.3 Weapons art\n\n- [ ] pistol GLB;\n- [ ] shotgun GLB;\n- [ ] bow + arrow GLB;\n- [ ] correct hand/socket attachment;\n- [ ] muzzle anchor from model rather than approximate player offset.',
              '## 8.3 Weapons art\n\n- [~] production-direction pistol visual implemented procedurally at realistic ~21 cm scale; replace with final GLB later if materially better;\n- [ ] shotgun GLB;\n- [ ] bow + arrow GLB;\n- [x] animated right-hand position socket foundation;\n- [x] muzzle anchor from active production weapon rather than approximate player offset.'
          )
          replace(
              'dev.md',
              'Current:\n\n- [x] local photo selection;\n- [x] local persistence;\n- [x] photo mapped to actual low-poly head front, not floating card.',
              'Current:\n\n- [x] local photo selection;\n- [x] local persistence;\n- [x] photo mapped to actual low-poly head front, not floating card;\n- [x] production hero path maps the uploaded photo to a curved shell attached to the real `Head` bone;\n- [x] visual smoke validates the full file-input → production-head path.'
          )
          replace(
              'dev.md',
              'After hardening PR is green and merged:\n\n1. **Production hero GLB spike** behind `PlayerRuntime`.\n2. Add CharacterModel + AnimationMixer and prove idle/walk/run.\n3. Add real pistol socket and aim/fire animation.\n4. Expand to shotgun and bow.\n5. Replace Walker with first production infected asset, then Runner/Brute.',
              'After the 0.9.0 hero vertical slice merge:\n\n1. **Pistol fire/reload animation integration** from the already-vendored CC0 library.\n2. Finalize production pistol art only if a GLB materially improves the current readable socket visual.\n3. Expand production weapon visuals/sockets to shotgun and bow.\n4. Replace Walker with the first production infected asset, then Runner/Brute.'
          )

          replace(
              'structure.md',
              'Последняя актуализация: **2026-08-12**  \nRepository: `ptaskaev91-glitch/facefall-survivor`  \nSource of truth: `main` after merge of active hardening PR  \nArchitecture checkpoint: **0.8.5–0.8.7 HARDENED**',
              'Последняя актуализация: **2026-08-13**  \nRepository: `ptaskaev91-glitch/facefall-survivor`  \nSource of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`  \nArchitecture checkpoint: **0.9.0 HERO VERTICAL SLICE**'
          )
          replace(
              'structure.md',
              '''│   └── assets/\n│       ├── ATTRIBUTION.md\n│       └── levels/''',
              '''│   └── assets/\n│       ├── ATTRIBUTION.md\n│       ├── characters/\n│       │   └── quaternius-universal-base-male/\n│       ├── animations/\n│       │   └── quaternius-universal-animation-library/\n│       └── levels/'''
          )
          replace(
              'structure.md',
              '''│   ├── characters/\n│   │   └── FaceSystem.ts''',
              '''│   ├── characters/\n│   │   ├── CharacterLocomotion.ts\n│   │   ├── CharacterModel.ts\n│   │   ├── WeaponSocketVisual.ts\n│   │   └── FaceSystem.ts'''
          )
          replace(
              'structure.md',
              '      ├── PlayerRuntime      ← player transform/collider/face/visual',
              '      ├── PlayerRuntime      ← player transform/collider + CharacterModel/face/weapon visual boundary'
          )
          replace(
              'structure.md',
              '- `PlayerCapsule`;\n- movement/facing;\n- spawn/reset;\n- muzzle transform;\n- FaceSystem and player visual lifecycle.',
              '- `PlayerCapsule`;\n- movement/facing;\n- spawn/reset;\n- `CharacterModel` rig/AnimationMixer lifecycle;\n- uploaded-face routing to both legacy fallback and production head shell;\n- production weapon socket visual + production muzzle transform;\n- FaceSystem fallback and player visual lifecycle.'
          )

          history = Path('history.md')
          h = history.read_text('utf-8')
          h = h.replace('Последняя актуализация: **2026-08-12**', 'Последняя актуализация: **2026-08-13**', 1)
          marker = '\n# 20. How to continue this file\n'
          if marker not in h:
              raise SystemExit('history continuation marker missing')
          section = '''\n# 20. 0.9.0 — production hero vertical slice\n\nPR #20 on `visual/0.9.0-hero-glb-spike` moved the game from a procedural player body to a real rigged hero pipeline behind `PlayerRuntime`.\n\nAsset/legal decisions:\n\n- official Quaternius Universal Base Characters Standard pack selected as production-direction hero source;\n- official Universal Animation Library Standard non-root-motion GLB selected for locomotion;\n- both sources are CC0 and their original licenses/provenance are retained in the vendored asset folders;\n- ambiguous third-party derivative GLBs found during research were explicitly rejected rather than copied.\n\nImplemented:\n\n- `CharacterModel` with `GLTFLoader`, `SkeletonUtils`, `AnimationMixer` and cleanup ownership;\n- 65-bone humanoid rig with `Head`, hands and finger bones;\n- rotation-only animation retargeting so library translation/scale tracks cannot overwrite the base hero bone lengths;\n- idle / walk / run locomotion selection and crossfades;\n- skeleton-height normalization and foot grounding after SkinnedMesh bounds proved unreliable;\n- Quaternius +Z visual facing corrected by 180° to match Facefall gameplay -Z facing;\n- uploaded photo converted to a feathered curved face shell attached to the real `Head` bone;\n- production pistol socket follows animated `hand_r` position while the barrel remains aligned with gameplay facing;\n- production muzzle origin is used by actual `WeaponSystem.fire`;\n- automatic legacy procedural-player fallback remains if production GLTF loading fails.\n\nVisual CI was expanded from TOP/3RD to include `mobile-face-front.png` with a synthetic uploaded face. This exposed and led to fixes for three issues that status-only CI would have missed:\n\n1. animation translation/scale tracks distorted hero proportions;\n2. raw SkinnedMesh bounds produced wrong hero scale;\n3. the Quaternius hero initially faced 180° away from gameplay aim.\n\nA first pistol socket also revealed an unrealistic 43 cm weapon silhouette; it was reduced to a ~21 cm service-pistol proportion and revalidated.\n\nCI runs through strict TypeScript, unit tests, mobile Playwright visual smoke, Vercel production build and deployment-root assertion.\n\nNext ordered work after merge: pistol fire/reload animation integration, shotgun/bow production visuals, then production infected.\n\n---\n'''
          h = h.replace(marker, section + marker.replace('# 20.', '# 21.'), 1)
          history.write_text(h, 'utf-8')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text('utf-8'))
          data['version'] = '0.9.0-alpha.0'
          data['packages']['']['version'] = '0.9.0-alpha.0'
          lock.write_text(json.dumps(data, indent=2) + '\n', 'utf-8')
          PY

      - name: Commit checkpoint documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dev.md history.md structure.md package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '0.9.0: record hero vertical slice checkpoint'
          git push origin HEAD:visual/0.9.0-hero-glb-spike
