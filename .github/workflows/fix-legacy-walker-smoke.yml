name: Fix Legacy Walker Smoke

on:
  push:
    branches: [milestone/0.10.0-production-core]
    paths: [.github/workflows/fix-legacy-walker-smoke.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.10.0-production-core
      - name: Align legacy Walker smoke with shared infected runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/smoke/rigged-walker.spec.ts')
          s = p.read_text()
          s = s.replace('riggedWalkerReady', 'riggedInfectedReady')
          s = s.replace("'walker-rigged-visual'", "'infected-rigged-visual'")
          s = s.replace('riggedWalkerRuntime', 'riggedInfectedRuntime')
          s = s.replace('if (object.isMesh && object.userData.damageTargetId !== id) missingTargetIds += 1;', 'if (object.userData.damageCollider && object.userData.damageTargetId !== id) missingTargetIds += 1;')
          p.write_text(s)
          PY
          rm .github/workflows/fix-legacy-walker-smoke.yml
      - name: Commit focused smoke fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/rigged-walker.spec.ts .github/workflows/fix-legacy-walker-smoke.yml
          git commit -m "test: align Walker smoke with shared infected runtime"
          git push origin HEAD:milestone/0.10.0-production-core
