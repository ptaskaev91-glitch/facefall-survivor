name: Engine Next CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'agent/**']
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'PROJECT.md'
      - 'ARCHITECTURE.md'
      - 'dev.md'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'PROJECT.md'
      - 'ARCHITECTURE.md'
      - 'dev.md'
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: read

concurrency:
  group: engine-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_CACHE: /var/cache/dev-platform/npm
  PLAYWRIGHT_BROWSERS_PATH: /var/cache/dev-platform/browsers

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, moscow-game]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install locked dependencies from Moscow cache
        run: npm ci --no-audit --no-fund --cache "$NPM_CONFIG_CACHE"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Ensure Chromium exists in shared Moscow cache
        run: PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" npx playwright install chromium

      - name: Heavy browser smoke and deploy build
        run: |
          dev-heavy bash -lc '
            set -euo pipefail
            export PLAYWRIGHT_BROWSERS_PATH=/var/cache/dev-platform/browsers
            npm run test:smoke
            npm run build:deploy
            test -f dist-next/index.html
            test -f dist-next/engine-lab.html
            cmp -s dist-next/index.html dist-next/engine-lab.html
            test ! -e dist-next/legacy
          '

      - name: Store diagnostics locally on Moscow
        if: always()
        shell: bash
        run: |
          set -u
          dst="/var/lib/dev-platform/artifacts/super-makar/${GITHUB_RUN_ID}"
          mkdir -p "$dst"
          cp -a test-artifacts "$dst/" 2>/dev/null || true
          cp -a reports "$dst/" 2>/dev/null || true
          cp -a playwright-report "$dst/" 2>/dev/null || true
          if [ -d dist-next ]; then
            du -sh dist-next > "$dst/build-size.txt" 2>/dev/null || true
          fi
          {
            echo "time=$(date -Is)"
            echo "host=$(hostname)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_status=${{ job.status }}"
            echo "artifact_root=$dst"
          } > "$dst/status.txt"
