name: Engine Next CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Persist generated lockfile on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already tracked'
            exit 0
          fi
          cp package-lock.json /tmp/facefall-package-lock.json
          git fetch origin "${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git checkout -B "${HEAD_REF}" "refs/remotes/origin/${HEAD_REF}"
          cp /tmp/facefall-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock npm dependencies"
          git push origin "HEAD:${HEAD_REF}"

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:smoke

      - name: Build combined Vercel bundle
        run: npm run build:deploy

      - name: Upload combined deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefall-dist-next
          path: dist-next
          if-no-files-found: error
          retention-days: 3

      - name: Publish engine-next preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .preview-publish
          mkdir .preview-publish
          cp -R dist-next/. .preview-publish/
          cd .preview-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b engine-next-preview
          git add .
          git commit -m "Engine next preview ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin engine-next-preview
