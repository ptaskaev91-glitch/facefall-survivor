name: Engine Next CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build engine-next
        run: npm run build:next
