name: Engine Next CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:smoke

      - name: Build combined Vercel bundle
        run: npm run build:deploy

      - name: Verify 0.8 is deployment root
        run: |
          grep -q "ENGINE NEXT 0.8" dist-next/index.html
          test -f dist-next/legacy/index.html
          test -f dist-next/legacy/game-v050.js
          test -f dist-next/legacy/styles-safe.css

      - name: Upload combined deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefall-dist-next
          path: dist-next
          if-no-files-found: error
          retention-days: 3

      - name: Publish engine-next preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .preview-publish
          mkdir .preview-publish
          cp -R dist-next/. .preview-publish/
          cd .preview-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b engine-next-preview
          git add .
          git commit -m "Engine next preview ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin engine-next-preview