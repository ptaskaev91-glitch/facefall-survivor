name: Engine Next CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'engine-lab.html'
      - 'index.html'
      - 'styles-safe.css'
      - 'game-v050.js'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build combined Vercel bundle
        run: npm run build:deploy
