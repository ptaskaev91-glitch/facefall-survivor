name: Engine Next CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: write

concurrency:
  group: engine-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh dependency lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit refreshed dependency lock to feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/0.13-recast-runtime'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/package-lock.json package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Recast dependencies"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$GITHUB_HEAD_REF"
          fi
      - name: Install refreshed locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and visual checkpoints
        run: npm run test:smoke
      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facefall-visual-checkpoints
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - name: Build Vercel bundle
        run: npm run build:deploy
      - name: Verify engine-next is sole deployment root
        run: |
          test -f dist-next/index.html
          test -f dist-next/engine-lab.html
          cmp -s dist-next/index.html dist-next/engine-lab.html
          test ! -e dist-next/legacy
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefall-engine-next
          path: dist-next
          if-no-files-found: error
          retention-days: 7
      - name: Publish engine-next preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .engine-next-preview
          mkdir -p .engine-next-preview
          cp -a dist-next/. .engine-next-preview/
          cd .engine-next-preview
          git init
          git checkout -b engine-next-preview
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Engine next preview $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin engine-next-preview
