name: Engine Next CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: read

# Emergency circuit breaker. This run cancels stale heavy Engine Next work in the
# same v3 concurrency group. Restore the full workflow only after Moscow platform
# bootstrap installs the guarded dev-heavy wrapper.
concurrency:
  group: engine-next-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuit-breaker:
    runs-on: [self-hosted, linux, x64, moscow-game]
    timeout-minutes: 2
    steps:
      - name: Hold Game CI during host recovery
        shell: bash
        run: |
          set -euo pipefail
          echo "MOSCOW_GAME_CI_CIRCUIT_BREAKER $(date -Is)"
          echo "Heavy Game CI intentionally disabled until guarded dev-heavy is installed."
