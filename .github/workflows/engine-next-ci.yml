name: Engine Next CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'engine-lab.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/engine-next-ci.yml'

permissions:
  contents: write

concurrency:
  group: engine-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Finalize 0.14 checkpoint on feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/0.14-ai-perception-lod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          python3 <<'PY'
          from pathlib import Path

          def append_once(path, marker, text):
              p = Path(path)
              current = p.read_text()
              if marker not in current:
                  p.write_text(current.rstrip() + "\n\n" + text.strip() + "\n")

          def replace_required(path, old, new):
              p = Path(path)
              current = p.read_text()
              if new in current:
                  return
              if old not in current:
                  raise RuntimeError(f'missing expected text in {path}: {old}')
              p.write_text(current.replace(old, new, 1))

          append_once('dev.md', '## 0.14.0 — infected perception + AI LOD checkpoint', '''
          ## 0.14.0 — infected perception + AI LOD checkpoint (2026-08-17)

          > This checkpoint is authoritative and closes the first four AI items left after 0.13.0.

          - [x] final static-world LOS/perception policy;
          - [x] weapon/noise perception;
          - [x] target stickiness / last-seen memory;
          - [x] distance-based AI/path/SpatialHash update LOD;
          - [x] footsteps and family-pistol noise feed the same perception system;
          - [x] browser regression covers hidden → heard → visible → sticky chase → investigate;
          - [x] unit coverage for cadence/noise hierarchy and EnemyBrain transitions.

          Next ordered work:
          - [ ] Face System 2.0 crop/fitting polish on the production head;
          - [ ] `?debug=1` performance/AI/nav metrics overlay;
          - [ ] Android profiling and budget tuning;
          - [ ] final HUD cleanup after profiling;
          - [ ] optional nav debug overlay only if useful for development.
          ''')

          append_once('history.md', '## 0.14.0 — Infected perception + AI LOD', '''
          ## 0.14.0 — Infected perception + AI LOD (2026-08-17)

          - Continued from the stable 0.13.0 Recast checkpoint.
          - Wired infected LOS to the authored/static `CollisionWorld`; the previous default-visible path is no longer used by `GameApp`.
          - Added eye-to-torso LOS sampling, last-seen target memory and a short 0.65s sticky chase before investigate fallback.
          - Hidden player movement is no longer read as the pursuit target after LOS breaks; infected pursue the last actually seen/heard point.
          - Added distinct hearing radii for shotgun, pistol and bow plus walking/sprinting noise.
          - Supermama/Superpapa pistol fire now wakes nearby infected too.
          - Added distance-based cadence for LOS and nav/SpatialHash/local-avoidance steering while preserving fixed-step movement/animation.
          - Added unit and live Playwright behavior coverage for perception transitions and LOD policy.
          - Development PR: #34.
          ''')

          append_once('structure.md', '## Engine Next 0.14.0 perception / AI structure', '''
          ## Engine Next 0.14.0 perception / AI structure

          The infected update path now separates perception cadence from movement integration:

          - `src/enemies/EnemyPerception.ts` — sight ranges, hearing radii, target-stick duration and distance-based perception/steering cadence policy;
          - `src/enemies/EnemyBrain.ts` — explicit wander / investigate / sticky chase / visible chase / hold / attack / stagger intent selection;
          - `src/enemies/EnemySystem.ts` — per-actor perception memory/timers, last-known target, steering cache and SpatialHash/local-avoidance refresh;
          - `GameApp.canEnemySeeTarget()` — authored/static collision LOS provider;
          - `CombatRuntime` — weapon-shot noise producer;
          - `GameApp` footstep event bridge — movement-noise producer;
          - `FamilyCompanionSystem` — ally pistol-noise producer.

          Recast remains the global pathfinding layer and is still hidden behind `NavigationQuery`. LOS uses collision geometry, not navmesh. Expensive LOS/path/crowd queries are distance-throttled, while actor velocity integration and animation remain fixed-step.
          ''')

          replace_required(
              'src/enemies/EnemySystem.ts',
              'spawn(type: EnemyId, position: THREE.Vector3): EnemyActor | null {',
              'spawn(type: EnemyId, position: THREE.Vector3, initialTarget?: THREE.Vector3): EnemyActor | null {'
          )
          replace_required(
              'src/enemies/EnemySystem.ts',
              '      alertTimer: 1.4,',
              '      alertTimer: initialTarget ? 12 : 1.4,'
          )
          replace_required(
              'src/enemies/EnemySystem.ts',
              '      lastKnownTarget: position.clone(),',
              '      lastKnownTarget: (initialTarget ?? position).clone(),'
          )
          replace_required(
              'src/app/GameApp.ts',
              'for (const request of this.waveDirector.update(dt, this.enemySystem.activeCount, effectiveMax, this.family.heroCount)) this.enemySystem.spawn(request.type, request.position);',
              'for (const request of this.waveDirector.update(dt, this.enemySystem.activeCount, effectiveMax, this.family.heroCount)) this.enemySystem.spawn(request.type, request.position, this.player.position);'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json dev.md history.md structure.md src/enemies/EnemySystem.ts src/app/GameApp.ts
          if ! git diff --cached --quiet; then
            git commit -m "ai: preserve wave pressure without wallhack"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$GITHUB_HEAD_REF"
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and visual checkpoints
        run: npm run test:smoke
      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facefall-visual-checkpoints
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - name: Build Vercel bundle
        run: npm run build:deploy
      - name: Verify engine-next is sole deployment root
        run: |
          test -f dist-next/index.html
          test -f dist-next/engine-lab.html
          cmp -s dist-next/index.html dist-next/engine-lab.html
          test ! -e dist-next/legacy
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefall-engine-next
          path: dist-next
          if-no-files-found: error
          retention-days: 7
      - name: Publish engine-next preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .engine-next-preview
          mkdir -p .engine-next-preview
          cp -a dist-next/. .engine-next-preview/
          cd .engine-next-preview
          git init
          git checkout -b engine-next-preview
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Engine next preview $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin engine-next-preview
