name: Build 011 Authored Level
on:
  push:
    branches: [visual/0.11.0-abandoned-outskirts]
permissions:
  contents: write
jobs:
  build-level:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.11.0-abandoned-outskirts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build authored GLB and runtime integration
        run: |
          python -m pip install --quiet trimesh
          python <<'PY'
          import trimesh, numpy as np, pathlib, json
          from trimesh.transformations import translation_matrix, rotation_matrix
          root=pathlib.Path('.')
          out=root/'public/assets/levels/abandoned-outskirts/level.glb'
          out.parent.mkdir(parents=True,exist_ok=True)
          scene=trimesh.Scene()
          C={'grass':[41,57,39,255],'road':[36,42,40,255],'wet':[17,23,22,255],'dirt':[64,57,46,255],'con':[85,88,82,255],'brick':[76,48,40,255],'wood':[74,60,45,255],'roof':[35,42,41,255],'metal':[53,59,57,255],'rust':[99,53,37,255],'glass':[38,54,55,255],'leaf':[31,53,36,255],'water':[14,28,27,255]}
          def add_box(name,size,pos,color,rot=0):
              g=trimesh.creation.box(extents=size); g.visual.vertex_colors=C[color]; T=translation_matrix(pos)
              if rot: T=T@rotation_matrix(rot,[0,1,0])
              scene.add_geometry(g,node_name=name,geom_name=name,transform=T)
          def add_cyl(name,r,h,pos,color):
              g=trimesh.creation.cylinder(radius=r,height=h,sections=10); g.visual.vertex_colors=C[color]; scene.add_geometry(g,node_name=name,geom_name=name,transform=translation_matrix(pos))
          add_box('terrain-ground',[118,.12,118],[0,-.12,0],'grass'); add_box('road-main',[12.5,.12,102],[0,-.01,-2],'road'); add_box('decor-road-wet',[5.4,.03,88],[.4,.07,-3],'wet'); add_box('access-lane',[18,.08,6],[-13,-.01,7],'dirt',.15)
          add_box('garage-shell',[10,4.2,8],[-17,2.1,-7],'con'); add_box('garage-roof',[10.8,.35,8.8],[-17,4.35,-7],'roof'); add_box('garage-door',[5.3,2.8,.22],[-17,1.45,-2.9],'rust')
          add_box('house-shell',[9,5.4,8],[18,2.7,10],'brick'); add_box('house-door',[1.35,2.4,.18],[18,1.2,5.93],'wood'); add_box('house-roof',[10,.45,9],[18,5.55,10],'roof')
          for x in np.arange(9,29,2.3): add_box(f'fence-east-{x:.1f}',[.1,1.75,1.9],[float(x),.88,-5.5],'metal')
          for x in np.arange(-28,-7,2.3): add_box(f'fence-west-{x:.1f}',[.1,1.75,1.9],[float(x),.88,-5.5],'metal')
          add_box('gate-arm',[8.8,.18,.22],[2.3,1.35,-5.4],'rust'); add_box('car-body',[1.9,.72,4.2],[3.7,.62,-16],'rust',.18); add_box('car-cabin',[1.72,.74,1.8],[3.55,1.25,-15.7],'metal',.18)
          for x,z in [(-31,-26),(-29,16),(29,-19),(31,25),(-20,29),(25,39)]:
              add_cyl(f'tree-trunk-{x}-{z}',.38,4.8,[x,2.4,z],'wood'); g=trimesh.creation.icosphere(subdivisions=1,radius=2.4); g.visual.vertex_colors=C['leaf']; scene.add_geometry(g,node_name=f'decor-tree-crown-{x}-{z}',geom_name=f'decor-tree-crown-{x}-{z}',transform=translation_matrix([x,5.4,z]))
          for i,(x,z,sx,sz) in enumerate([(-2,-24,2.5,1.1),(2,-8,1.8,.8),(-3,15,2.2,1.2),(2.5,29,1.6,.65)]): add_box(f'decor-puddle-{i}',[sx,.025,sz],[x,.08,z],'water')
          add_box('dumpster',[2.1,1.45,1.4],[-10.8,.73,-11],'metal'); add_box('road-block',[3.6,.9,.85],[-2.8,.46,-35],'con',.22); add_box('warehouse',[20,6.4,8],[-15,3.2,-45],'con'); add_box('warehouse-roof',[21,.4,9],[-15,6.55,-45],'roof')
          out.write_bytes(scene.export(file_type='glb'))
          print('level.glb',out.stat().st_size)
          PY
          python <<'PY'
          from pathlib import Path
          p=Path('src/world/LevelLoader.ts'); s=p.read_text()
          old='''    const root = gltf.scene;\n    AssetManager.prepareRenderable(root, request.shadows);\n    this.collisionWorld?.rebuild(root);\n\n    return { root, manifest };'''
          new='''    const root = gltf.scene;\n    AssetManager.prepareRenderable(root, request.shadows);\n    root.name = root.name || 'authored-level-root';\n    if (this.collisionWorld) {\n      const collisionRoot = new Group();\n      root.updateMatrixWorld(true);\n      root.traverse((object) => {\n        if (!(object instanceof Mesh) || object.name.startsWith('decor-')) return;\n        const proxy = new Mesh(object.geometry);\n        proxy.matrix.copy(object.matrixWorld);\n        proxy.matrixAutoUpdate = false;\n        collisionRoot.add(proxy);\n      });\n      this.collisionWorld.rebuild(collisionRoot);\n    }\n\n    return { root, manifest };'''
          s=s.replace("import type { Group } from 'three';","import { Group, Mesh } from 'three';").replace(old,new); p.write_text(s)
          p=Path('src/world/WorldRuntime.ts'); s=p.read_text()
          old='''  async loadManifest(): Promise<{ manifest: LevelManifest; levelId: string }> {\n    try {\n      const manifest = await this.levelLoader.loadManifest('/assets/levels/abandoned-outskirts/level.manifest.json');\n      this.applyManifestLights(manifest);\n      return { manifest, levelId: manifest.id };'''
          new='''  async loadManifest(): Promise<{ manifest: LevelManifest; levelId: string }> {\n    try {\n      const loaded = await this.levelLoader.load({ glbUrl: '/assets/levels/abandoned-outskirts/level.glb', manifestUrl: '/assets/levels/abandoned-outskirts/level.manifest.json', shadows: this.quality.shadows });\n      AssetManager.disposeObject(this.staticWorld);\n      this.staticWorld.clear();\n      this.staticWorld.add(loaded.root);\n      this.applyManifestLights(loaded.manifest);\n      return { manifest: loaded.manifest, levelId: loaded.manifest.id };'''
          s=s.replace(old,new); p.write_text(s)
          PY
          cat > tests/smoke/authored-level.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';
          test.use({ viewport: { width: 412, height: 915 }, hasTouch: true, isMobile: true });
          test('Abandoned Outskirts loads authored GLB as active world', async ({ page }) => {
            const errors:string[]=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('/engine-lab.html',{waitUntil:'domcontentloaded'}); await page.locator('#menuCamThird').click(); await page.locator('#startGame').click();
            await expect(page.locator('#status')).toContainText('level=abandoned-outskirts',{timeout:20000});
            const state=await page.evaluate(()=>{const app=(window as any).__facefallApp; const names:string[]=[]; app.world.scene.traverse((o:any)=>names.push(o.name)); return {garage:names.includes('garage-shell'),house:names.includes('house-shell'),car:names.includes('car-body'),fallback:app.world.scene.getObjectByName('lab-fallback')};});
            expect(state.garage&&state.house&&state.car).toBe(true); expect(state.fallback).toBeFalsy(); expect(errors).toEqual([]);
            await page.evaluate(()=>{const app=(window as any).__facefallApp; app.pause(); app.world.render();}); await page.screenshot({path:'test-artifacts/mobile-authored-outskirts-third.png',fullPage:true});
          });
          EOF
          node -e "let p=require('./package.json');p.version='0.11.0-alpha.0';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm .github/workflows/build-011-authored-level.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/LevelLoader.ts src/world/WorldRuntime.ts public/assets/levels/abandoned-outskirts/level.glb tests/smoke/authored-level.spec.ts package.json package-lock.json .github/workflows/build-011-authored-level.yml
          git commit -m '0.11.0: load authored Abandoned Outskirts GLB'
          git push origin HEAD:visual/0.11.0-abandoned-outskirts
