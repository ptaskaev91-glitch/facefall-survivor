name: Patch 012 UI
on:
  push:
    branches:
      - 'feature/0.12.0-super-makar-family'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch family menu and economy HUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine-lab.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Facefall Engine Next</title>','<title>Супер Макар</title>')
          s=s.replace('FACEFALL // 0.9.1 PISTOL ANIM','СУПЕР МАКАР')
          s=s.replace('FACEFALL SURVIVOR · ENGINE NEXT 0.9.1','СУПЕР МАКАР · СЕМЕЙНЫЙ ОТРЯД')
          s=s.replace('ТВОЁ ЛИЦО.<br>ТВОЯ НОЧЬ.','СУПЕР МАКАР.<br>ВСЯ СЕМЬЯ В БОЮ.')
          s=s.replace('Загрузи фотографию — она останется только в этом браузере. Выбери камеру и начинай забег.','Загрузи фото Макара, мамы и папы. Супермама вступит после 3-й волны, Суперпапа — после 6-й. Фото остаются только в этом браузере.')
          old='''<div class="face-box"><img id="facePreview" alt="Предпросмотр лица" hidden><div class="face-empty" id="faceEmpty">НЕТ ФОТО<br><small>будет нейтральное лицо</small></div></div>\n          <div class="face-actions"><label class="button-like" for="faceInput">ВЫБРАТЬ ФОТО</label><input id="faceInput" type="file" accept="image/*"><button class="remove-face" id="removeFace" type="button" hidden>УДАЛИТЬ</button></div>'''
          new='''<div class="face-box"><img id="makarFacePreview" alt="Фото Макара" hidden><div class="face-empty" id="makarFaceEmpty">СУПЕР МАКАР<br><small>главный герой</small></div></div>\n          <div class="face-actions"><label class="button-like" for="makarFaceInput">ФОТО МАКАРА</label><input id="makarFaceInput" type="file" accept="image/*"><button class="remove-face" id="makarRemoveFace" type="button" hidden>×</button></div>\n          <div class="family-face-row"><div><b>СУПЕРМАМА</b><small>после 3-й волны</small></div><label class="button-like" for="mamaFaceInput">ФОТО</label><input id="mamaFaceInput" type="file" accept="image/*"><button class="remove-face" id="mamaRemoveFace" type="button" hidden>×</button><img id="mamaFacePreview" alt="Фото мамы" hidden><span id="mamaFaceEmpty" hidden></span></div>\n          <div class="family-face-row"><div><b>СУПЕРПАПА</b><small>после 6-й волны</small></div><label class="button-like" for="papaFaceInput">ФОТО</label><input id="papaFaceInput" type="file" accept="image/*"><button class="remove-face" id="papaRemoveFace" type="button" hidden>×</button><img id="papaFacePreview" alt="Фото папы" hidden><span id="papaFaceEmpty" hidden></span></div>'''
          if old not in s: raise SystemExit('old face setup not found')
          s=s.replace(old,new)
          oldhud='<div class="run-hud"><span>HP <b id="runHp">100</b></span><span>WAVE <b id="runWave">1</b></span><span>KILLS <b id="runKills">0</b></span><span>SCORE <b id="runScore">000000</b></span></div>'
          newhud='<div class="run-hud"><span>HP <b id="runHp">100</b></span><span>WAVE <b id="runWave">1</b></span><span>KILLS <b id="runKills">0</b></span><span>🪙 <b id="coinCount">0</b></span><b id="runScore" hidden>000000</b></div><div class="weapon-shop"><button id="buyShotgun" type="button">ДРОБОВИК · 20</button><button id="buyBow" type="button">ЛУК · 30</button></div>'
          if oldhud not in s: raise SystemExit('run hud not found')
          s=s.replace(oldhud,newhud)
          s=s.replace('.face-actions input{display:none}', '.face-actions input,.family-face-row input{display:none}.family-face-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-top:8px;padding:8px;border:1px solid rgba(255,255,255,.1);font-size:9px}.family-face-row div{display:grid}.family-face-row small{color:#728078}.family-face-row img{width:30px;height:30px;object-fit:cover;border-radius:50%}.weapon-shop{position:absolute;right:max(12px,env(safe-area-inset-right));top:56px;display:grid;gap:5px;pointer-events:auto}.weapon-shop button{padding:6px 8px;font-size:8px}.weapon-shop button:disabled{opacity:.45}')
          s=s.replace('Фото и настройки сохраняются только локально в этом браузере.','Фото всех трёх героев и настройки сохраняются только локально в этом браузере.')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-012-ui.yml
          git add engine-lab.html
          git commit -m '0.12.0: add Super Makar family menu and shop HUD'
          git push origin HEAD:feature/0.12.0-super-makar-family
