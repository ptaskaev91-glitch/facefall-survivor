name: Finalize 0.17 checkpoint

on:
  push:
    branches:
      - agent/0.17-blood-moon-weather
    paths:
      - scripts/finalize-017.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.17-blood-moon-weather
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Finalize 0.17 files
        run: |
          npm version 0.17.0 --no-git-tag-version
          node scripts/finalize-017.mjs
      - name: Commit generated checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json engine-lab.html README.md dev.md history.md structure.md
          if git diff --cached --quiet; then
            echo "Nothing to finalize"
            exit 0
          fi
          git commit -m "release: finalize Engine Next 0.17.0 weather checkpoint"
          git push origin HEAD:agent/0.17-blood-moon-weather
