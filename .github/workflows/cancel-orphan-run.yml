name: Cancel orphan Game run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cancel-orphan-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-orphan:
    # Temporary control-plane repair only; never merged to main.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel stale pre-recovery runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/'"$REPOSITORY"'/actions/runs'
          cancel() {
            run_id="$1"
            code="$(curl -sS -o "/tmp/cancel-${run_id}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/$run_id/cancel")"
            echo "cancel run=$run_id http=$code"
            cat "/tmp/cancel-${run_id}.json" || true
            echo
            case "$code" in
              202|409) ;;
              *) exit 1 ;;
            esac
          }
          # 32254680369 is the orphaned in-progress run whose worker was force-cleared.
          # 32256188444 is the superseded pending run in the old concurrency namespace.
          cancel 32254680369
          cancel 32256188444
