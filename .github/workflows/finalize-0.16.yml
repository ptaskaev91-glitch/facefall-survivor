name: Finalize 0.16 checkpoint

on:
  push:
    branches: [agent/0.16-debug-performance-overlay]
    paths:
      - '.github/workflows/finalize-0.16.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.16-debug-performance-overlay
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Finalize version and checkpoint docs
        run: node scripts/finalize-0.16.mjs
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json engine-lab.html README.md dev.md history.md structure.md
          if git diff --cached --quiet; then
            echo 'Checkpoint already finalized.'
            exit 0
          fi
          git commit -m 'chore: finalize Engine Next 0.16.0'
          git push origin HEAD:agent/0.16-debug-performance-overlay
