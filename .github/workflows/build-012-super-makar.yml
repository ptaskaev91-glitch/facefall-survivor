name: Build 012 Super Makar
on:
  push:
    branches: [feature/0.12.0-super-makar-family]
permissions:
  contents: write
jobs:
  build-family:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply family gameplay milestone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path, text):
              p=Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(text, encoding='utf-8')
          def repl(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:80]}')
              p.write_text(s.replace(old,new), encoding='utf-8')

          write('src/family/FamilyCompanionSystem.ts', r'''import * as THREE from 'three';
import { CharacterModel } from '../characters/CharacterModel';
import type { DamageSystem } from '../combat/DamageSystem';
import type { EnemySystem } from '../enemies/EnemySystem';
import type { QualityProfile } from '../graphics/quality';

export type FamilyRole = 'mama' | 'papa';
export interface FamilyFaces { mamaFaceDataUrl?: string | null; papaFaceDataUrl?: string | null; }
interface Companion { role: FamilyRole; root: THREE.Group; model: CharacterModel; fireTimer: number; unlocked: boolean; face: string | null; }
const HERO_URL='/assets/characters/quaternius-universal-base-male/Superhero_Male_FullBody.gltf';
const ANIM_URL='/assets/animations/quaternius-universal-animation-library/UAL1_Standard.glb';

export class FamilyCompanionSystem {
  private readonly companions: Record<FamilyRole, Companion>;
  private readonly temp = new THREE.Vector3();
  private readonly target = new THREE.Vector3();
  constructor(private readonly scene: THREE.Scene, private readonly quality: QualityProfile, private readonly enemies: EnemySystem, private readonly damage: DamageSystem) {
    this.companions={mama:this.make('mama'),papa:this.make('papa')};
  }
  configureFaces(faces: FamilyFaces): void { this.companions.mama.face=faces.mamaFaceDataUrl??null; this.companions.papa.face=faces.papaFaceDataUrl??null; }
  reset(): void { for(const c of Object.values(this.companions)){c.unlocked=false;c.root.visible=false;c.fireTimer=0;} }
  async syncWave(wave:number): Promise<void> {
    if(wave>=4 && !this.companions.mama.unlocked) await this.unlock(this.companions.mama);
    if(wave>=7 && !this.companions.papa.unlocked) await this.unlock(this.companions.papa);
  }
  update(dt:number, playerPosition:THREE.Vector3, playerFacing:THREE.Vector3): void {
    const active=this.active;
    active.forEach((c,index)=>{
      const side=index===0?-1:1; const back=active.length===1?1.6:1.9;
      const desired=this.temp.copy(playerPosition).add(new THREE.Vector3(side*1.45,0,back));
      c.root.position.lerp(desired,1-Math.exp(-dt*5.5));
      const enemy=this.nearestEnemy(c.root.position);
      if(enemy){
        enemy.getWorldPosition(this.target); const dir=this.target.clone().sub(c.root.position).setY(0);
        if(dir.lengthSq()>1e-5)c.root.rotation.y=Math.atan2(-dir.x,-dir.z);
        c.fireTimer-=dt;
        if(c.fireTimer<=0){c.fireTimer=c.role==='mama'?0.72:0.58; const id=enemy.userData.damageTargetId as string|undefined; if(id){
          const hitPoint=this.target.clone().add(new THREE.Vector3(0,1.0,0)); const shotDir=hitPoint.clone().sub(c.root.position).normalize();
          this.damage.apply({amount:c.role==='mama'?17:21,kind:'bullet',sourceId:`super-${c.role}`,targetId:id,hitPoint,direction:shotDir,impulse:5,hitZone:'torso',critical:false});
          c.model.playPistolFire();
        }}
      } else { c.root.rotation.y=Math.atan2(-playerFacing.x,-playerFacing.z); }
      c.model.update(dt, c.root.position.distanceTo(desired)>0.08?3.8:0);
    });
  }
  get heroCount(): number { return 1+this.active.length; }
  get activeRoles(): FamilyRole[] { return this.active.map(c=>c.role); }
  dispose(): void { for(const c of Object.values(this.companions)){c.model.dispose();c.root.removeFromParent();} }
  private get active(): Companion[]{return Object.values(this.companions).filter(c=>c.unlocked);}
  private make(role:FamilyRole): Companion { const root=new THREE.Group();root.name=`super-${role}`;root.visible=false;const model=new CharacterModel(this.quality.shadows);root.add(model.root);this.scene.add(root);return{role,root,model,fireTimer:0,unlocked:false,face:null}; }
  private async unlock(c:Companion):Promise<void>{c.unlocked=true;c.root.visible=true;try{await c.model.load(HERO_URL);await c.model.loadAnimations(ANIM_URL);await c.model.setFaceDataUrl(c.face);c.model.setVisible(true);c.model.setActiveWeapon('pistol');}catch(e){console.warn(`[Super Makar] ${c.role} model unavailable`,e);}}
  private nearestEnemy(from:THREE.Vector3):THREE.Object3D|null{let best:THREE.Object3D|null=null,bestD=30*30;for(const root of this.enemies.aimTargets){if(!root.visible||!root.userData.damageTargetId)continue;const d=root.position.distanceToSquared(from);if(d<bestD){bestD=d;best=root;}}return best;}
}
''')

          write('src/economy/CoinSystem.ts', r'''import * as THREE from 'three';
interface CoinActor { root:THREE.Group; amount:number; velocity:THREE.Vector3; life:number; }
export class CoinSystem {
  private readonly coins:CoinActor[]=[]; private readonly temp=new THREE.Vector3();
  constructor(private readonly scene:THREE.Scene,private readonly onCollect:(amount:number)=>void){}
  spawn(position:THREE.Vector3,amount:number):void{const root=new THREE.Group();root.name='zombie-coin';const mat=new THREE.MeshStandardMaterial({color:0xf5c542,emissive:0x8a5a00,emissiveIntensity:.35,metalness:.72,roughness:.28});const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.055,14),mat);mesh.rotation.x=Math.PI/2;root.add(mesh);root.position.copy(position).add(new THREE.Vector3(0,.75,0));this.scene.add(root);this.coins.push({root,amount,velocity:new THREE.Vector3((Math.random()-.5)*1.8,2.2+Math.random(),(Math.random()-.5)*1.8),life:20});}
  update(dt:number,player:THREE.Vector3):void{for(let i=this.coins.length-1;i>=0;i--){const c=this.coins[i];c.life-=dt;c.velocity.y-=5.4*dt;c.root.position.addScaledVector(c.velocity,dt);if(c.root.position.y<.18){c.root.position.y=.18;c.velocity.y=Math.abs(c.velocity.y)*.28;c.velocity.x*=.82;c.velocity.z*=.82;}c.root.rotation.y+=dt*5.2;this.temp.copy(c.root.position).sub(player).setY(0);if(this.temp.lengthSq()<1.35*1.35){this.onCollect(c.amount);this.remove(i);continue;}if(c.life<=0)this.remove(i);}}
  reset():void{while(this.coins.length)this.remove(this.coins.length-1);} dispose():void{this.reset();}
  get activeCount():number{return this.coins.length;}
  private remove(i:number):void{const [c]=this.coins.splice(i,1);c.root.traverse(o=>{if(!(o instanceof THREE.Mesh))return;o.geometry.dispose();const ms=Array.isArray(o.material)?o.material:[o.material];for(const m of ms)m.dispose();});c.root.removeFromParent();}
}
''')

