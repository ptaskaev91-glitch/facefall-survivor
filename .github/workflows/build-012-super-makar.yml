          write('src/app/ProductShell.ts', r'''import { aimController } from '../aim/AimController';
import type { CameraMode } from '../camera/CameraDirector';
import { FaceStore, type FaceSlot } from '../persistence/FaceStore';
import { SettingsStore, type FacefallSettings } from '../persistence/SettingsStore';
import type { AudioSystem } from '../presentation/audio/AudioSystem';
import type { GameApp } from './GameApp';
interface FaceDom{input:HTMLInputElement;preview:HTMLImageElement;empty:HTMLElement;remove:HTMLButtonElement;}
interface ProductShellDom{overlay:HTMLElement;start:HTMLButtonElement;makar:FaceDom;mama:FaceDom;papa:FaceDom;cameraTop:HTMLButtonElement;cameraThird:HTMLButtonElement;sensitivity:HTMLInputElement;sensitivityValue:HTMLElement;deadzone:HTMLInputElement;deadzoneValue:HTMLElement;aimAssist:HTMLInputElement;aimAssistValue:HTMLElement;volume:HTMLInputElement;volumeValue:HTMLElement;loading:HTMLElement;error:HTMLElement;}
export class ProductShell{
 private stores={makar:new FaceStore('makar'),mama:new FaceStore('mama'),papa:new FaceStore('papa')}; private faces:Record<FaceSlot,string|null>={makar:null,mama:null,papa:null}; private cameraMode:CameraMode='top'; private settingsStore=new SettingsStore(); private settings:FacefallSettings=this.settingsStore.defaults(); private busy=false;
 constructor(private app:GameApp,private dom:ProductShellDom,private audio:AudioSystem){}
 attach():void{for(const role of ['makar','mama','papa'] as FaceSlot[]){this.faces[role]=this.stores[role].load();this.bindFace(role);}this.settings=this.settingsStore.load();this.applySettings();this.refreshFaces();this.refreshCamera();this.refreshSettings();this.dom.cameraTop.addEventListener('click',this.onTop);this.dom.cameraThird.addEventListener('click',this.onThird);for(const e of [this.dom.sensitivity,this.dom.deadzone,this.dom.aimAssist,this.dom.volume])e.addEventListener('input',this.onSettingsInput);this.dom.start.addEventListener('click',this.onStart);this.show();}
 detach():void{}
 show():void{this.app.enterMenu();this.dom.overlay.dataset.visible='true';this.dom.loading.textContent='';this.dom.error.textContent='';}
 private bindFace(role:FaceSlot):void{const d=this.dom[role];d.input.addEventListener('change',()=>void this.onFaceChange(role));d.remove.addEventListener('click',()=>{this.faces[role]=null;this.stores[role].remove();this.refreshFaces();});}
 private async onFaceChange(role:FaceSlot):Promise<void>{const file=this.dom[role].input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>12*1024*1024){this.dom.error.textContent='Нужно изображение до 12 МБ.';return;}try{const data=await this.readFile(file);this.faces[role]=data;this.stores[role].save(data);this.dom.error.textContent='';this.refreshFaces();}catch{this.dom.error.textContent='Не удалось прочитать фотографию.';}finally{this.dom[role].input.value='';}}
 private onTop=()=>{this.cameraMode='top';this.refreshCamera();}; private onThird=()=>{this.cameraMode='third';this.refreshCamera();};
 private onSettingsInput=()=>{this.settings={aimSensitivity:Number(this.dom.sensitivity.value),aimDeadzone:Number(this.dom.deadzone.value),aimAssist:Number(this.dom.aimAssist.value),masterVolume:Number(this.dom.volume.value)};this.settingsStore.save(this.settings);this.applySettings();this.refreshSettings();};
 private onStart=async()=>{if(this.busy)return;this.busy=true;this.dom.start.disabled=true;this.dom.loading.textContent='ЗАГРУЖАЕМ СУПЕР МАКАРА…';try{await this.audio.resume();await this.app.start({cameraMode:this.cameraMode,faceDataUrl:this.faces.makar,mamaFaceDataUrl:this.faces.mama,papaFaceDataUrl:this.faces.papa});this.dom.overlay.dataset.visible='false';this.dom.loading.textContent='';}catch(e){this.dom.error.textContent=`Не удалось запустить игру: ${e instanceof Error?e.message:String(e)}`;this.app.enterMenu();}finally{this.busy=false;this.dom.start.disabled=false;}};
 private applySettings(){aimController.configure({sensitivity:this.settings.aimSensitivity,deadzone:this.settings.aimDeadzone});this.app.configureAimAssist(Math.max(.01,this.settings.aimAssist));this.audio.setVolume(this.settings.masterVolume);}
 private refreshSettings(){this.dom.sensitivity.value=String(this.settings.aimSensitivity);this.dom.deadzone.value=String(this.settings.aimDeadzone);this.dom.aimAssist.value=String(this.settings.aimAssist);this.dom.volume.value=String(this.settings.masterVolume);this.dom.sensitivityValue.textContent=`${this.settings.aimSensitivity.toFixed(2)}×`;this.dom.deadzoneValue.textContent=`${Math.round(this.settings.aimDeadzone*100)}%`;this.dom.aimAssistValue.textContent=`${Math.round(this.settings.aimAssist*100)}%`;this.dom.volumeValue.textContent=`${Math.round(this.settings.masterVolume*100)}%`;}
 private refreshFaces(){for(const role of ['makar','mama','papa'] as FaceSlot[]){const d=this.dom[role],src=this.faces[role];if(src){d.preview.src=src;d.preview.hidden=false;d.empty.hidden=true;d.remove.hidden=false;}else{d.preview.removeAttribute('src');d.preview.hidden=true;d.empty.hidden=false;d.remove.hidden=true;}}}
 private refreshCamera(){this.dom.cameraTop.dataset.active=String(this.cameraMode==='top');this.dom.cameraThird.dataset.active=String(this.cameraMode==='third');}
 private readFile(file:File):Promise<string>{return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>typeof r.result==='string'?res(r.result):rej(new Error());r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
}
export function resolveProductShellDom():ProductShellDom{const r=<T extends HTMLElement>(id:string):T=>{const e=document.getElementById(id) as T|null;if(!e)throw new Error(`Missing product shell element: #${id}`);return e;};const fd=(p:string):FaceDom=>({input:r<HTMLInputElement>(`${p}FaceInput`),preview:r<HTMLImageElement>(`${p}FacePreview`),empty:r<HTMLElement>(`${p}FaceEmpty`),remove:r<HTMLButtonElement>(`${p}RemoveFace`)});return{overlay:r('productMenu'),start:r<HTMLButtonElement>('startGame'),makar:fd('makar'),mama:fd('mama'),papa:fd('papa'),cameraTop:r<HTMLButtonElement>('menuCamTop'),cameraThird:r<HTMLButtonElement>('menuCamThird'),sensitivity:r<HTMLInputElement>('aimSensitivity'),sensitivityValue:r('aimSensitivityValue'),deadzone:r<HTMLInputElement>('aimDeadzone'),deadzoneValue:r('aimDeadzoneValue'),aimAssist:r<HTMLInputElement>('aimAssist'),aimAssistValue:r('aimAssistValue'),volume:r<HTMLInputElement>('masterVolume'),volumeValue:r('masterVolumeValue'),loading:r('menuLoading'),error:r('menuError')};}
''')

