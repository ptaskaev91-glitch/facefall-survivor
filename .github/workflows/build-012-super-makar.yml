name: Build 012 Super Makar
on:
  push:
    branches:
      - 'feature/0.12.0-super-makar-family'
permissions:
  contents: write
jobs:
  build-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply family gameplay milestone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine-lab.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Facefall Engine Next</title>','<title>Супер Макар</title>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine-lab.html
          git rm .github/workflows/build-012-super-makar.yml
          git commit -m 'chore: verify Super Makar workflow execution'
          git push origin HEAD:feature/0.12.0-super-makar-family
