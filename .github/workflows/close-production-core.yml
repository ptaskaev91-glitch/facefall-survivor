name: Close Production Core

on:
  push:
    branches:
      - milestone/0.10.0-production-core
    paths:
      - .github/workflows/close-production-core.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.10.0-production-core
      - run: python3 scripts/close-production-core.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          npm ci
          npm run typecheck
          npm run test:unit
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev.md history.md structure.md package-lock.json
          git rm .github/workflows/close-production-core.yml scripts/close-production-core.py
          git commit -m "0.10.0: record production core checkpoint"
          git push origin HEAD:milestone/0.10.0-production-core
