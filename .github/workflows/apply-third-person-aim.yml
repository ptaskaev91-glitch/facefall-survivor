name: Apply third-person aim correctness

on:
  push:
    branches: [agent/third-person-aim-correctness]
    paths:
      - '.github/workflows/apply-third-person-aim.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, moscow-game]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/third-person-aim-correctness
          fetch-depth: 0

      - name: Apply bounded Step 1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/combat/WeaponSystem.ts',
              'export type PlayerAimResolver = (out: Vector3) => Vector3;',
              'export type PlayerAimResolver = (out: Vector3, origin: Vector3) => Vector3;')
          replace_once('src/combat/WeaponSystem.ts',
              'this.resolvePlayerAim ? this.resolvePlayerAim(this.resolvedDirection) : this.resolvedDirection.copy(fallbackDirection)',
              'this.resolvePlayerAim ? this.resolvePlayerAim(this.resolvedDirection, origin) : this.resolvedDirection.copy(fallbackDirection)')

          replace_once('src/aim/AimController.ts',
              '  getWorldDirection(out = new Vector3()): Vector3 {\n    return out.copy(this.worldDirection);\n  }\n',
              '  getWorldDirection(out = new Vector3()): Vector3 {\n    return out.copy(this.worldDirection);\n  }\n\n  getCameraRay(camera: PerspectiveCamera, originOut: Vector3, directionOut: Vector3): void {\n    this.raycaster.setFromCamera(this.ndc, camera);\n    originOut.copy(this.raycaster.ray.origin);\n    directionOut.copy(this.raycaster.ray.direction).normalize();\n  }\n')

          replace_once('src/app/GameApp.ts',
              "import { aimController } from '../aim/AimController';\n",
              "import { aimController } from '../aim/AimController';\nimport { resolveThirdPersonAimPoint, resolveThirdPersonShotDirection } from '../aim/ThirdPersonShotResolver';\n")
          replace_once('src/app/GameApp.ts',
              '  private readonly weaponSystem = new WeaponSystem(this.events);',
              '  private readonly weaponSystem = new WeaponSystem(this.events, (out, origin) => this.resolvePlayerAim(out, origin));')
          replace_once('src/app/GameApp.ts',
              '  private readonly aimDirection = new THREE.Vector3();\n  private readonly aimNdc = new THREE.Vector2();',
              '  private readonly aimDirection = new THREE.Vector3();\n  private readonly cameraRayOrigin = new THREE.Vector3();\n  private readonly cameraRayDirection = new THREE.Vector3();\n  private readonly cameraAimPoint = new THREE.Vector3();\n  private readonly aimNdc = new THREE.Vector2();')
          replace_once('src/app/GameApp.ts',
              '  private updateFootsteps(dt: number, targetSpeed: number, sprinting: boolean): void {',
              '''  private resolvePlayerAim(out: THREE.Vector3, origin: THREE.Vector3): THREE.Vector3 {
    if (this.cameraMode === 'top') {
      out.copy(aimController.getWorldDirection(out)).setY(0);
      if (out.lengthSq() <= 1e-6) out.copy(this.player.facing);
      return out.normalize();
    }

    aimController.getCameraRay(this.world.camera, this.cameraRayOrigin, this.cameraRayDirection);
    this.raycaster.set(this.cameraRayOrigin, this.cameraRayDirection);
    this.raycaster.far = 70;

    const enemyEntry = this.raycaster
      .intersectObjects([...this.enemySystem.meshes], true)
      .find((entry) => entry.object.visible && entry.object.userData.damageTargetId);
    const worldEntry = this.world.collisionWorld.raycast(this.cameraRayOrigin, this.cameraRayDirection, 70);

    resolveThirdPersonAimPoint(
      this.cameraRayOrigin,
      this.cameraRayDirection,
      enemyEntry ? { point: enemyEntry.point, distance: enemyEntry.distance } : null,
      worldEntry ? { point: worldEntry.position, distance: worldEntry.distance } : null,
      70,
      this.cameraAimPoint
    );

    return resolveThirdPersonShotDirection(origin, this.cameraAimPoint, this.cameraRayDirection, out);
  }

  private updateFootsteps(dt: number, targetSpeed: number, sprinting: boolean): void {''')

          Path('src/aim/ThirdPersonShotResolver.ts').write_text('''import { Vector3 } from 'three';

export interface ThirdPersonAimHit { point: Vector3; distance: number; }

export function resolveThirdPersonAimPoint(
  rayOrigin: Vector3,
  rayDirection: Vector3,
  enemyHit: ThirdPersonAimHit | null,
  worldHit: ThirdPersonAimHit | null,
  fallbackDistance: number,
  out: Vector3
): Vector3 {
  const enemyValid = Boolean(enemyHit && Number.isFinite(enemyHit.distance) && enemyHit.distance >= 0);
  const worldValid = Boolean(worldHit && Number.isFinite(worldHit.distance) && worldHit.distance >= 0);
  if (enemyValid && (!worldValid || enemyHit!.distance <= worldHit!.distance)) return out.copy(enemyHit!.point);
  if (worldValid) return out.copy(worldHit!.point);
  return out.copy(rayOrigin).addScaledVector(rayDirection, Math.max(0.1, fallbackDistance));
}

export function resolveThirdPersonShotDirection(
  muzzleOrigin: Vector3,
  aimPoint: Vector3,
  fallbackDirection: Vector3,
  out: Vector3
): Vector3 {
  out.copy(aimPoint).sub(muzzleOrigin);
  if (out.lengthSq() <= 1e-6) out.copy(fallbackDirection);
  if (out.lengthSq() <= 1e-6) out.set(0, 0, -1);
  return out.normalize();
}
''')

          Path('tests/unit/third-person-shot-resolver.test.ts').write_text('''import assert from 'node:assert/strict';
import test from 'node:test';
import { Vector3 } from 'three';
import { resolveThirdPersonAimPoint, resolveThirdPersonShotDirection } from '../../src/aim/ThirdPersonShotResolver';
import { WeaponSystem } from '../../src/combat/WeaponSystem';
import type { FacefallEvents } from '../../src/combat/types';
import { EventBus } from '../../src/core/EventBus';

test('third-person aim picks nearest camera-ray hit', () => {
  const origin = new Vector3(0, 2, 4); const ray = new Vector3(0, 0, -1); const out = new Vector3();
  resolveThirdPersonAimPoint(origin, ray, { point: new Vector3(0, 2, -8), distance: 12 }, { point: new Vector3(0, 2, -2), distance: 6 }, 70, out);
  assert.deepEqual(out.toArray(), [0, 2, -2]);
});

test('third-person shot converges from muzzle to aim point', () => {
  const muzzle = new Vector3(0.65, 1.2, 0.4); const aimPoint = new Vector3(-1.2, 1.75, -8.5);
  const direction = resolveThirdPersonShotDirection(muzzle, aimPoint, new Vector3(1, 0, 0), new Vector3());
  assert.ok(direction.distanceTo(aimPoint.clone().sub(muzzle).normalize()) < 1e-10);
});

test('WeaponSystem passes exact physical muzzle origin to resolver', () => {
  const events = new EventBus<FacefallEvents>(); const muzzle = new Vector3(3, 1.2, -2);
  let seenOrigin: Vector3 | null = null; let shotDirection: Vector3 | null = null;
  const weapons = new WeaponSystem(events, (out, origin) => { seenOrigin = origin.clone(); return out.set(0.25, 0.1, -1).normalize(); });
  events.on('shot', (shot) => { shotDirection = shot.direction.clone(); });
  assert.equal(weapons.fire('player', muzzle, new Vector3(1, 0, 0)), true);
  assert.deepEqual(seenOrigin?.toArray(), muzzle.toArray());
  assert.ok(shotDirection && shotDirection.dot(new Vector3(1, 0, 0)) < 0.9);
});
''')

          Path('tests/smoke/third-person-shot-direction.spec.ts').write_text('''import { expect, test } from '@playwright/test';

test.use({ viewport: { width: 412, height: 915 }, hasTouch: true, isMobile: true });

test('3RD shot follows reticle even when body facing is wrong', async ({ page }) => {
  const errors: string[] = []; page.on('pageerror', (error) => errors.push(error.message));
  await page.goto('/engine-lab.html', { waitUntil: 'domcontentloaded' });
  await page.locator('#menuCamThird').click(); await page.locator('#startGame').click();
  await expect(page.locator('#status')).toContainText('state=playing', { timeout: 20_000 });
  const diagnostic = await page.evaluate(() => {
    const app = (window as any).__facefallApp; app.waveDirector.stop(); app.enemySystem.reset();
    const forward = app.player.facing.clone().setY(0).normalize(); const spawn = app.player.position.clone().addScaledVector(forward, 8); spawn.y = app.player.position.y;
    if (!app.enemySystem.spawn('walker', spawn)) throw new Error('target spawn failed');
    app.player.facing.set(1, 0, 0); app.player.muzzle(app.muzzle); const muzzle = app.muzzle.clone();
    let captured: any = null; const off = app.events.on('shot', (shot: any) => { if (shot.sourceId === 'player') captured = shot; });
    const fired = app.weaponSystem.fire('player', app.muzzle, app.player.facing); off();
    if (!fired || !captured) throw new Error('shot missing');
    return { bodyFacingDot: captured.direction.clone().normalize().dot(app.player.facing), muzzle: muzzle.toArray() };
  });
  expect(diagnostic.bodyFacingDot).toBeLessThan(0.9); expect(errors).toEqual([]);
});
''')
          PY

          rm -f .github/workflows/apply-third-person-aim.yml
          git status --short

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ptaskaev91-glitch'
          git config user.email 'p.taskaev91@gmail.com'
          git add src tests .github/workflows/apply-third-person-aim.yml
          git commit -m 'fix: align third-person shots with reticle ray'
          git push origin HEAD:agent/third-person-aim-correctness
