name: Vercel Production Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    # One-time temporary external HTTP probe. This branch/PR is never merged;
    # the canonical Engine Next CI in main remains Moscow self-hosted only.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Diagnose Vercel production deployment
        shell: bash
        env:
          URL: https://super-makar-ja7ban720-pavels-projects-0b29bb12.vercel.app
        run: |
          set -u
          code="$(curl -L -sS -D /tmp/headers.txt -o /tmp/super-makar.html -w '%{http_code}' --connect-timeout 10 --max-time 45 "$URL" || true)"
          echo "http=$code"
          echo '--- headers ---'
          cat /tmp/headers.txt || true
          echo '--- response sample ---'
          head -c 1600 /tmp/super-makar.html || true
          echo
          if [ "$code" = "200" ] && grep -qi '<title>Супер Макар</title>' /tmp/super-makar.html; then
            echo "Production HTML is live and identifies Super Makar."
            exit 0
          fi
          exit 1
