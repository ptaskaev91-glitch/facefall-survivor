name: Vercel Production Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  credentials:
    # Temporary same-repo PR diagnostic. Only boolean presence is printed; no secret value is exposed.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Vercel secret presence
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID_VALUE: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_VALUE: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          present() { if [ -n "$2" ]; then echo "$1=true"; else echo "$1=false"; fi; }
          present VERCEL_TOKEN "$VERCEL_TOKEN_VALUE"
          present VERCEL_ORG_ID "$VERCEL_ORG_ID_VALUE"
          present VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID_VALUE"
          present VERCEL_AUTOMATION_BYPASS_SECRET "$VERCEL_AUTOMATION_BYPASS_SECRET_VALUE"
