name: Vercel Production Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    # Temporary external no-auth check; never merged.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check no-team-id Vercel deployment
        shell: bash
        env:
          URL: https://super-makar-public-probe-o6u7c9zv2-pavels-projects-0b29bb12.vercel.app
        run: |
          set -u
          code="$(curl -sS -D /tmp/headers.txt -o /tmp/body.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$URL" || true)"
          echo "http=$code"
          cat /tmp/headers.txt
          echo '--- body ---'
          head -c 800 /tmp/body.txt || true
          echo
          if [ "$code" = "200" ] && grep -q 'public-probe-2026-08-19' /tmp/body.txt; then
            echo 'PUBLIC=true'
            exit 0
          fi
          echo 'PUBLIC=false'
          exit 1
