name: Vercel Production Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    # Temporary external no-auth check; never merged.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production aliases
        shell: bash
        run: |
          set -u
          check() {
            label="$1"; url="$2"; expected="$3"
            code="$(curl -sS -D "/tmp/${label}.headers" -o "/tmp/${label}.body" -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            echo "${label}_http=$code"
            grep -iE '^(location:|server:|x-vercel-id:)' "/tmp/${label}.headers" || true
            if [ "$code" = "200" ] && grep -qi "$expected" "/tmp/${label}.body"; then
              echo "${label}_PUBLIC=true"
              return 0
            fi
            echo "${label}_PUBLIC=false"
            return 1
          }

          ok=0
          check live_alias 'https://super-makar-live-pavels-projects-0b29bb12.vercel.app' '<title>Супер Макар</title>' && ok=1
          check live_short 'https://super-makar-live.vercel.app' '<title>Супер Макар</title>' && ok=1
          exit $((1-ok))
