name: Vercel Production Smoke

on:
  push:
    branches: ['agent/vercel-production-smoke']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, moscow-game]
    timeout-minutes: 12
    steps:
      - name: Poll Vercel production deployment
        shell: bash
        env:
          URL: https://super-makar-ja7ban720-pavels-projects-0b29bb12.vercel.app
        run: |
          set -euo pipefail
          echo "Polling $URL"
          for i in $(seq 1 120); do
            code="$(curl -L -sS -o /tmp/super-makar.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$URL" || true)"
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ] && grep -qi '<title>Супер Макар</title>' /tmp/super-makar.html; then
              echo "Production HTML is live and identifies Super Makar."
              grep -o '<title>[^<]*</title>' /tmp/super-makar.html | head -1
              exit 0
            fi
            sleep 5
          done
          echo "Vercel production did not become healthy in time."
          echo '--- response sample ---'
          head -c 1000 /tmp/super-makar.html || true
          exit 1
