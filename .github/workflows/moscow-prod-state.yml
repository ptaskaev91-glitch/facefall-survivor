name: Moscow production state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/moscow-prod-state.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Moscow Game production externally
        shell: bash
        run: |
          set -euo pipefail
          domain=super-makar.72-56-14-168.sslip.io
          echo '=== DNS ==='; getent ahostsv4 "$domain" || true
          echo '=== HTTP ==='; curl -sS -D- --max-time 6 "http://$domain/health" || true
          echo '=== HTTPS ==='; curl -k -sS -D- --max-time 8 "https://$domain/health" || true
          echo '=== GAME ==='
          html="$(curl -kfsS --max-time 10 "https://$domain/" || true)"
          printf '%s\n' "$html" | head -c 500
          grep -F '<title>Супер Макар</title>' <<<"$html" >/dev/null
          echo "MOSCOW_GAME_EXTERNAL_OK https://$domain/"
