name: Finish 011 Release
on:
  push:
    branches: [visual/0.11.0-abandoned-outskirts]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.11.0-abandoned-outskirts
      - name: Apply release polish
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/app/Bootstrap.ts'); s=p.read_text(); s=s.replace('FACEFALL // 0.10.0 PRODUCTION CORE','FACEFALL // 0.11.0 ABANDONED OUTSKIRTS').replace('FACEFALL SURVIVOR · ENGINE NEXT 0.10.0','FACEFALL SURVIVOR · ENGINE NEXT 0.11.0'); s=s.replace('Walker / Runner / Brute используют общий production infected rig с разными силуэтами, походкой и combat reactions.','Мир загружается из authored Abandoned Outskirts GLB: мокрая дорога, ворота, постройки, брошенная машина и окружение; процедурная сцена остаётся аварийным fallback.'); p.write_text(s)
          p=Path('engine-lab.html'); s=p.read_text().replace('FACEFALL // 0.9.1 PISTOL ANIM','FACEFALL // 0.11.0 ABANDONED OUTSKIRTS').replace('FACEFALL SURVIVOR · ENGINE NEXT 0.9.1','FACEFALL SURVIVOR · ENGINE NEXT 0.11.0').replace('3RD: крестик в центре, свайп поворачивает камеру по горизонтали. FIRE стреляет по активному направлению.','3RD: aim-assist двигает крестик к видимому заражённому; свайп сохраняет ручной контроль камеры. FIRE стреляет через фактическую точку прицела.'); p.write_text(s)
          p=Path('tests/smoke/authored-level.spec.ts'); s=p.read_text(); s=s.replace("await page.evaluate(()=>{const app=(window as any).__facefallApp; app.pause(); app.world.render();});", "await page.evaluate(()=>{const app=(window as any).__facefallApp; app.pause(); const c=app.world.camera; c.position.set(10,7,20); c.fov=48; c.lookAt(0,1,-6); c.updateProjectionMatrix(); app.world.render();});"); p.write_text(s)
          for name, text in {
            'history.md':'\n\n---\n\n# 0.11.0 — Abandoned Outskirts authored level\n\nPR #28 replaces the active procedural environment with an authored GLB level while retaining fallback safety. `LevelLoader` separates decorative `decor-*` meshes from collision, and the manifest remains the gameplay marker source. Visual CI adds a dedicated authored-level checkpoint.\n',
            'dev.md':'\n\n## 0.11.0 Abandoned Outskirts\n\n- [x] authored `level.glb` loaded by `WorldRuntime`;\n- [x] road / gate / garage / house / abandoned car / trees / puddles / warehouse composition;\n- [x] collision built from authored structural meshes, decorative meshes excluded;\n- [x] manifest remains source of spawn / loot / light markers;\n- [x] procedural world retained only as load-failure fallback;\n- [x] mobile authored-level screenshot gate.\n\nNext: offline Recast navigation over the authored level, then realistic art replacement / Face System 2.0 / final HUD.\n',
            'structure.md':'\n\n### 0.11.0 authored world\n\n`public/assets/levels/abandoned-outskirts/level.glb` is now the active static world asset. `WorldRuntime` owns its lifecycle, `LevelLoader` builds structural collision while ignoring `decor-*` meshes, and `level.manifest.json` continues to own gameplay markers.\n'
          }.items():
            p=Path(name); p.write_text(p.read_text()+text)
          PY
          rm .github/workflows/finish-011-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/Bootstrap.ts engine-lab.html tests/smoke/authored-level.spec.ts history.md dev.md structure.md .github/workflows/finish-011-release.yml
          git commit -m '0.11.0: finish authored outskirts release polish'
          git push origin HEAD:visual/0.11.0-abandoned-outskirts
