name: Patch 012 Enemy
on:
  push:
    branches:
      - 'feature/0.12.0-super-makar-family'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch EnemySystem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/enemies/EnemySystem.ts'); s=p.read_text()
          s=s.replace('  deathTimer: number;','  deathTimer: number;\n  groanTimer: number;')
          s=s.replace('  canSeeTarget?: (from: THREE.Vector3, to: THREE.Vector3) => boolean;','  canSeeTarget?: (from: THREE.Vector3, to: THREE.Vector3) => boolean;\n  onGroan?: (actor: EnemyActor) => void;')
          s=s.replace('wanderTimer: 0, deathTimer: 0,','wanderTimer: 0, deathTimer: 0, groanTimer: 1.5 + Math.random() * 3.5,')
          s=s.replace('actor.wanderTimer = Math.max(0, actor.wanderTimer - dt);\n      animateEnemyVisual','actor.wanderTimer = Math.max(0, actor.wanderTimer - dt);\n      actor.groanTimer = Math.max(0, actor.groanTimer - dt);\n      if (actor.groanTimer <= 0) { actor.groanTimer = 3.4 + Math.random() * 5.2; this.options.onGroan?.(actor); }\n      animateEnemyVisual')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-012-enemy.yml
          git add src/enemies/EnemySystem.ts
          git commit -m 'feat: add zombie walking groan cadence'
          git push origin HEAD:feature/0.12.0-super-makar-family
