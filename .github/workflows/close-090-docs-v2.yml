name: Close 0.9.0 Docs v2

on:
  pull_request:
    paths:
      - '.github/workflows/close-090-docs-v2.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.0-hero-glb-spike
          fetch-depth: 0
      - name: Patch docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def patch(path, changes):
              p=Path(path); text=p.read_text('utf-8')
              for old,new in changes:
                  if old in text:
                      text=text.replace(old,new,1)
              p.write_text(text,'utf-8')

          patch('dev.md', [
            ('Последняя актуализация: **2026-08-12**','Последняя актуализация: **2026-08-13**'),
            ('Source of truth: `main` after merge of the active hardening PR','Source of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`'),
            ('Текущий стабильный gameplay checkpoint до этого блока: **0.8.4 COMBAT + HUMANOID INFECTED**.  \nТекущий активный checkpoint: **0.8.5–0.8.7 HARDENING — repo hygiene + tests + GameApp decomposition**.','Текущий стабильный architecture checkpoint: **0.8.5–0.8.7 HARDENING**.  \nТекущий активный visual checkpoint: **0.9.0 HERO VERTICAL SLICE — rigged GLTF + animation + uploaded face + pistol socket**.'),
            ('- [ ] Character animation state transitions;','- [x] Character locomotion state transitions (pure idle/walk/run resolver);'),
            ('- [x] `mobile-third.png` after camera switch;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;','- [x] `mobile-third.png` after camera switch;\n- [x] `mobile-face-front.png` with a synthetic uploaded face for head-bone inspection;\n- [x] screenshots uploaded as `facefall-visual-checkpoints` artifact;'),
            ('- [ ] choose/license production-direction humanoid GLB;','- [x] choose/license production-direction humanoid GLB — Quaternius Universal Base Characters, CC0;'),
            ('- [ ] inspect skeleton/bones/scale/materials;','- [x] inspect skeleton/bones/scale/materials — 65-bone humanoid with `Head` / `hand_r`;'),
            ('- [ ] clone skinned meshes correctly (`SkeletonUtils` where needed);','- [x] clone skinned meshes correctly with `SkeletonUtils`;'),
            ('- [ ] CharacterModel wrapper lives behind PlayerRuntime;','- [x] `CharacterModel` wrapper lives behind `PlayerRuntime`;'),
            ('- [ ] head/face-compatible UV or dedicated face surface;','- [x] curved uploaded-face surface attached to the real `Head` bone;'),
            ('- [ ] weapon hand sockets;','- [x] production weapon socket foundation on animated `hand_r`;'),
            ('- [ ] LOD/asset budget.','- [ ] LOD/initial-download asset budget optimization.'),
            ('- [ ] AnimationMixer;','- [x] AnimationMixer;'),
            ('- [ ] idle;','- [x] idle;'),
            ('- [ ] walk;','- [x] walk;'),
            ('- [ ] run;','- [x] run;'),
            ('- [ ] state machine/crossfades;','- [x] locomotion state resolver + crossfades;'),
            ('- [ ] animation state unit tests where state logic is pure.','- [x] animation state unit tests where state logic is pure.'),
            ('- [ ] pistol GLB;','- [~] production-direction pistol visual at realistic ~21 cm scale; final GLB remains optional if materially better;'),
            ('- [ ] correct hand/socket attachment;','- [x] animated right-hand position socket foundation;'),
            ('- [ ] muzzle anchor from model rather than approximate player offset.','- [x] muzzle anchor from active production weapon rather than approximate player offset.'),
            ('- [x] photo mapped to actual low-poly head front, not floating card.','- [x] photo mapped to actual low-poly head front, not floating card;\n- [x] production path maps the uploaded photo to a curved shell attached to the real `Head` bone;\n- [x] visual smoke validates file input → production head.'),
            ('After hardening PR is green and merged:\n\n1. **Production hero GLB spike** behind `PlayerRuntime`.\n2. Add CharacterModel + AnimationMixer and prove idle/walk/run.\n3. Add real pistol socket and aim/fire animation.\n4. Expand to shotgun and bow.\n5. Replace Walker with first production infected asset, then Runner/Brute.','After the 0.9.0 hero vertical slice merge:\n\n1. **Pistol fire/reload animation integration** from the vendored CC0 library.\n2. Finalize production pistol art only if a GLB materially improves the current readable socket visual.\n3. Expand production weapon visuals/sockets to shotgun and bow.\n4. Replace Walker with the first production infected asset, then Runner/Brute.')
          ])

          patch('structure.md', [
            ('Последняя актуализация: **2026-08-12**','Последняя актуализация: **2026-08-13**'),
            ('Source of truth: `main` after merge of active hardening PR','Source of truth: `visual/0.9.0-hero-glb-spike` until PR #20 merge, then `main`'),
            ('Architecture checkpoint: **0.8.5–0.8.7 HARDENED**','Architecture checkpoint: **0.9.0 HERO VERTICAL SLICE**'),
            ('│       ├── ATTRIBUTION.md\n│       └── levels/','│       ├── ATTRIBUTION.md\n│       ├── characters/\n│       │   └── quaternius-universal-base-male/\n│       ├── animations/\n│       │   └── quaternius-universal-animation-library/\n│       └── levels/'),
            ('│   ├── characters/\n│   │   └── FaceSystem.ts','│   ├── characters/\n│   │   ├── CharacterLocomotion.ts\n│   │   ├── CharacterModel.ts\n│   │   ├── WeaponSocketVisual.ts\n│   │   └── FaceSystem.ts'),
            ('      ├── PlayerRuntime      ← player transform/collider/face/visual','      ├── PlayerRuntime      ← player transform/collider + CharacterModel/face/weapon visual boundary'),
            ('- player root transform;\n- `PlayerCapsule`;\n- movement integration;\n- facing vector;\n- spawn/reset;\n- muzzle world transform;\n- `FaceSystem` lifecycle;\n- current prototype low-poly player visual lifecycle.\n\nFuture `CharacterModel`, humanoid GLB, `SkeletonUtils`, `AnimationMixer` and weapon sockets belong **behind PlayerRuntime**.','- player root transform;\n- `PlayerCapsule`;\n- movement integration;\n- facing vector;\n- spawn/reset;\n- `CharacterModel` rig / `SkeletonUtils` / `AnimationMixer` lifecycle;\n- production hero scale/orientation normalization;\n- uploaded-face routing to fallback `FaceSystem` and production `Head` shell;\n- production pistol socket and muzzle world transform;\n- automatic procedural visual fallback when production assets fail.\n\nProduction hero/animation/weapon visual work now lives **behind PlayerRuntime**.')
          ])

          hp=Path('history.md'); h=hp.read_text('utf-8').replace('Последняя актуализация: **2026-08-12**','Последняя актуализация: **2026-08-13**',1)
          if '# 20. 0.9.0 — production hero vertical slice' not in h:
              marker='\n# 20. How to continue this file\n'
              section='''\n# 20. 0.9.0 — production hero vertical slice\n\nPR #20 on `visual/0.9.0-hero-glb-spike` moved Facefall from the procedural player body to a real rigged hero pipeline behind `PlayerRuntime`.\n\n- Quaternius Universal Base Characters Standard and Universal Animation Library Standard were obtained from official free-download paths and verified as CC0; original licenses/provenance are retained.\n- ambiguous derivative character files found elsewhere were rejected.\n- `CharacterModel` now owns `GLTFLoader`, `SkeletonUtils`, `AnimationMixer`, scaling, grounding and cleanup.\n- locomotion uses idle/walk/run crossfades with rotation-only retargeting so animation translation/scale tracks cannot distort the base rig.\n- the uploaded photo becomes a feathered curved shell attached to the real `Head` bone.\n- visual facing was corrected by 180° to match Facefall gameplay aim.\n- production pistol position follows animated `hand_r`; its muzzle is the actual origin used by `WeaponSystem.fire`.\n- the first 43 cm pistol prototype was caught by visual CI and resized to a realistic ~21 cm silhouette.\n- procedural player rendering remains an automatic fallback if production GLTF loading fails.\n\nVisual CI now captures TOP, 3RD and `mobile-face-front.png` with a synthetic uploaded face. These checkpoints caught rig-proportion, scale and facing defects that status-only CI did not.\n\nNext: pistol fire/reload animation integration, then shotgun/bow production visuals and production infected.\n\n---\n'''
              h=h.replace(marker,section+'\n# 21. How to continue this file\n',1)
          hp.write_text(h,'utf-8')

          lock=Path('package-lock.json'); data=json.loads(lock.read_text('utf-8')); data['version']='0.9.0-alpha.0'; data['packages']['']['version']='0.9.0-alpha.0'; lock.write_text(json.dumps(data,indent=2)+'\n','utf-8')
          PY
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dev.md history.md structure.md package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m '0.9.0: record hero vertical slice checkpoint'
          git push origin HEAD:visual/0.9.0-hero-glb-spike
