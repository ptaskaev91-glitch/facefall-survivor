name: Production Core Phase 4

on:
  push:
    branches:
      - milestone/0.10.0-production-core
    paths:
      - .github/workflows/production-core-phase4.yml

permissions:
  contents: write

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.10.0-production-core
      - run: python3 scripts/phase4-budget-lod.py
      - run: |
          npm ci
          npm run typecheck
          npm run test:unit
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/characters/WeaponSocketVisual.ts src/enemies/RiggedWalkerVisual.ts src/enemies/EnemyVisualFactory.ts src/enemies/EnemySystem.ts src/assets/AssetBudget.ts tests/unit/asset-budget.test.ts
          git rm .github/workflows/production-core-phase4.yml scripts/phase4-budget-lod.py
          git commit -m "0.10.0: enforce lazy asset budget and infected LOD"
          git push origin HEAD:milestone/0.10.0-production-core
