name: Production Core Phase 2

on:
  push:
    branches:
      - milestone/0.10.0-production-core
    paths:
      - .github/workflows/production-core-phase2.yml

permissions:
  contents: write

jobs:
  weapons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.10.0-production-core
      - run: python3 scripts/phase2-production-core.py
      - run: npm ci
      - run: node scripts/generate-production-weapons.mjs
      - run: |
          npm run typecheck
          npm run test:unit
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/characters/HeroCombatPose.ts src/characters/CharacterModel.ts src/player/PlayerRuntime.ts src/characters/WeaponSocketVisual.ts tests/unit/weapon-assets.test.ts public/assets/weapons/shotgun.glb public/assets/weapons/bow-arrow.glb
          git rm .github/workflows/production-core-phase2.yml scripts/phase2-production-core.py scripts/generate-production-weapons.mjs
          git commit -m "0.10.0: complete hero combat poses and weapon GLBs"
          git push origin HEAD:milestone/0.10.0-production-core
