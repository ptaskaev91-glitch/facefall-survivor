name: Patch 0.9.2 Shotgun

on:
  push:
    branches:
      - visual/0.9.2-shotgun-production
    paths:
      - '.github/workflows/patch-092-shotgun.yml'

permissions:
  contents: write

jobs:
  patch-shotgun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/0.9.2-shotgun-production
          fetch-depth: 0

      - name: Implement shotgun production slice
        shell: bash
        run: |
          cat > src/characters/WeaponSocketVisual.ts <<'TS'
          import * as THREE from 'three';
          import type { WeaponId } from '../combat/types';

          /**
           * Production weapon presentation driven by the animated right-hand socket.
           * Position follows the hand bone; weapon forward remains aligned with gameplay facing
           * so authored wrist roll cannot turn long barrels sideways.
           */
          export class WeaponSocketVisual {
            private characterRoot: THREE.Object3D | null = null;
            private hand: THREE.Bone | null = null;
            private socket: THREE.Group | null = null;
            private readonly weaponGroups = new Map<WeaponId, THREE.Group>();
            private readonly muzzles = new Map<WeaponId, THREE.Object3D>();
            private readonly handWorldPosition = new THREE.Vector3();
            private readonly geometries: THREE.BufferGeometry[] = [];
            private readonly materials: THREE.Material[] = [];
            private activeWeapon: WeaponId = 'pistol';
            private enabled = false;

            constructor(private readonly shadows: boolean) {}

            attach(characterRoot: THREE.Object3D, boneName = 'hand_r'): boolean {
              this.detach();
              characterRoot.updateWorldMatrix(true, true);

              const hand = characterRoot.getObjectByName(boneName);
              if (!(hand instanceof THREE.Bone)) return false;

              const socket = new THREE.Group();
              socket.name = 'weapon-socket-production';

              const pistol = this.buildPistol();
              const shotgun = this.buildShotgun();
              socket.add(pistol.group, shotgun.group);
              this.weaponGroups.set('pistol', pistol.group);
              this.weaponGroups.set('shotgun', shotgun.group);
              this.muzzles.set('pistol', pistol.muzzle);
              this.muzzles.set('shotgun', shotgun.muzzle);

              characterRoot.add(socket);
              this.characterRoot = characterRoot;
              this.hand = hand;
              this.socket = socket;
              this.updateVisibility();
              this.update();
              return true;
            }

            setActiveWeapon(weaponId: WeaponId): void {
              this.activeWeapon = weaponId;
              this.updateVisibility();
            }

            update(): void {
              if (!this.characterRoot || !this.hand || !this.socket || !this.enabled) return;
              this.characterRoot.updateWorldMatrix(true, true);
              this.hand.getWorldPosition(this.handWorldPosition);
              this.socket.position.copy(this.characterRoot.worldToLocal(this.handWorldPosition));
              this.socket.quaternion.identity();
            }

            setVisible(visible: boolean): void {
              this.enabled = visible;
              this.updateVisibility();
            }

            getMuzzleWorldPosition(out: THREE.Vector3): boolean {
              if (!this.enabled) return false;
              const muzzle = this.muzzles.get(this.activeWeapon);
              if (!muzzle) return false;
              muzzle.getWorldPosition(out);
              return true;
            }

            dispose(): void {
              this.detach();
              for (const geometry of this.geometries) geometry.dispose();
              for (const material of this.materials) material.dispose();
              this.geometries.splice(0);
              this.materials.splice(0);
            }

            private buildPistol(): { group: THREE.Group; muzzle: THREE.Object3D } {
              const group = new THREE.Group();
              group.name = 'weapon-pistol';

              const darkMetal = this.material({ color: 0x171b19, roughness: 0.3, metalness: 0.78 });
              const gripMaterial = this.material({ color: 0x252a27, roughness: 0.72, metalness: 0.18 });
              const sightMaterial = this.material({ color: 0x0b0d0c, roughness: 0.45, metalness: 0.5 });

              const slide = this.box(0.042, 0.036, 0.205, darkMetal);
              slide.position.set(0, 0.018, 0.105);
              const frame = this.box(0.038, 0.032, 0.125, darkMetal);
              frame.position.set(0, -0.008, 0.052);
              const barrel = this.cylinder(0.009, 0.135, darkMetal, 10);
              barrel.rotation.x = Math.PI / 2;
              barrel.position.set(0, 0.017, 0.135);
              const grip = this.box(0.039, 0.115, 0.052, gripMaterial);
              grip.position.set(0, -0.071, -0.005);
              grip.rotation.x = -0.18;
              const triggerGuard = new THREE.Mesh(
                this.geometry(new THREE.TorusGeometry(0.026, 0.006, 6, 12, Math.PI)),
                darkMetal
              );
              triggerGuard.rotation.x = Math.PI / 2;
              triggerGuard.position.set(0, -0.044, 0.045);
              triggerGuard.castShadow = this.shadows;
              const frontSight = this.box(0.009, 0.012, 0.013, sightMaterial);
              frontSight.position.set(0, 0.041, 0.194);
              const rearSight = this.box(0.028, 0.010, 0.011, sightMaterial);
              rearSight.position.set(0, 0.040, 0.020);
              group.add(slide, frame, barrel, grip, triggerGuard, frontSight, rearSight);

              const muzzle = new THREE.Object3D();
              muzzle.name = 'weapon-muzzle-pistol';
              muzzle.position.set(0, 0.017, 0.218);
              group.add(muzzle);
              return { group, muzzle };
            }

            private buildShotgun(): { group: THREE.Group; muzzle: THREE.Object3D } {
              const group = new THREE.Group();
              group.name = 'weapon-shotgun';

              const steel = this.material({ color: 0x202522, roughness: 0.34, metalness: 0.72 });
              const parkerized = this.material({ color: 0x121614, roughness: 0.48, metalness: 0.58 });
              const polymer = this.material({ color: 0x232824, roughness: 0.82, metalness: 0.08 });
              const wood = this.material({ color: 0x4b2e1d, roughness: 0.72, metalness: 0.02 });
              const bead = this.material({ color: 0xb3aa86, roughness: 0.35, metalness: 0.55 });

              // Pump-action proportions: ~98 cm overall. The animated hand sits near the
              // pistol grip/receiver while the barrel extends along Facefall local +Z.
              const receiver = this.box(0.074, 0.092, 0.285, steel);
              receiver.position.set(0, 0.005, 0.105);

              const barrel = this.cylinder(0.017, 0.605, parkerized, 12);
              barrel.rotation.x = Math.PI / 2;
              barrel.position.set(0, 0.044, 0.535);

              const magazineTube = this.cylinder(0.014, 0.49, parkerized, 10);
              magazineTube.rotation.x = Math.PI / 2;
              magazineTube.position.set(0, -0.005, 0.455);

              const pump = this.box(0.068, 0.082, 0.185, polymer);
              pump.position.set(0, -0.006, 0.385);
              for (const x of [-0.024, -0.012, 0, 0.012, 0.024]) {
                const rib = this.box(0.004, 0.086, 0.172, polymer);
                rib.position.set(x, -0.006, 0.385);
                group.add(rib);
              }

              const pistolGrip = this.box(0.058, 0.145, 0.085, polymer);
              pistolGrip.position.set(0, -0.092, -0.035);
              pistolGrip.rotation.x = -0.22;

              const stock = this.box(0.078, 0.105, 0.34, wood);
              stock.position.set(0, -0.006, -0.245);
              stock.rotation.x = -0.035;

              const buttPad = this.box(0.085, 0.118, 0.025, polymer);
              buttPad.position.set(0, -0.012, -0.425);

              const beadSight = this.box(0.012, 0.014, 0.012, bead);
              beadSight.position.set(0, 0.067, 0.827);

              group.add(receiver, barrel, magazineTube, pump, pistolGrip, stock, buttPad, beadSight);

              const muzzle = new THREE.Object3D();
              muzzle.name = 'weapon-muzzle-shotgun';
              muzzle.position.set(0, 0.044, 0.842);
              group.add(muzzle);
              return { group, muzzle };
            }

            private updateVisibility(): void {
              if (this.socket) this.socket.visible = this.enabled && this.weaponGroups.has(this.activeWeapon);
              for (const [weaponId, group] of this.weaponGroups) {
                group.visible = this.enabled && weaponId === this.activeWeapon;
              }
            }

            private detach(): void {
              this.socket?.removeFromParent();
              this.characterRoot = null;
              this.hand = null;
              this.socket = null;
              this.weaponGroups.clear();
              this.muzzles.clear();
            }

            private box(width: number, height: number, depth: number, material: THREE.Material): THREE.Mesh {
              const mesh = new THREE.Mesh(this.geometry(new THREE.BoxGeometry(width, height, depth)), material);
              mesh.castShadow = this.shadows;
              mesh.receiveShadow = false;
              return mesh;
            }

            private cylinder(radius: number, length: number, material: THREE.Material, segments: number): THREE.Mesh {
              const mesh = new THREE.Mesh(
                this.geometry(new THREE.CylinderGeometry(radius, radius, length, segments)),
                material
              );
              mesh.castShadow = this.shadows;
              mesh.receiveShadow = false;
              return mesh;
            }

            private geometry<T extends THREE.BufferGeometry>(geometry: T): T {
              this.geometries.push(geometry);
              return geometry;
            }

            private material(parameters: THREE.MeshStandardMaterialParameters): THREE.MeshStandardMaterial {
              const material = new THREE.MeshStandardMaterial(parameters);
              this.materials.push(material);
              return material;
            }
          }
          TS

          python3 - <<'PY'
          from pathlib import Path

          def patch(path, changes):
              p=Path(path); text=p.read_text('utf-8')
              for old,new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
                  text=text.replace(old,new,1)
              p.write_text(text,'utf-8')

          patch('src/characters/CharacterModel.ts', [
            ("import { resolveLocomotionState, type LocomotionState } from './CharacterLocomotion';", "import { resolveLocomotionState, type LocomotionState } from './CharacterLocomotion';\nimport type { WeaponId } from '../combat/types';"),
            ("  private desiredLocomotion: LocomotionState = 'idle';", "  private desiredLocomotion: LocomotionState = 'idle';\n  private activeWeapon: WeaponId = 'pistol';"),
            ("  playPistolFire(): boolean {", "  setActiveWeapon(weaponId: WeaponId): void {\n    if (this.activeWeapon === weaponId) return;\n    this.activeWeapon = weaponId;\n    if (!this.mixer || this.clips.length === 0) return;\n    this.bindLocomotionActions(this.clips);\n    this.setLocomotion(this.desiredLocomotion, true);\n  }\n\n  playPistolFire(): boolean {"),
            ("  dispose(): void {", "  playShotgunFire(): boolean {\n    const clip = this.findClip(\n      ['Shotgun_Fire', 'Shotgun_Shoot', 'Shotgun_Shot', 'Rifle_Fire', 'Rifle_Shoot', 'Rifle_Shot'],\n      [/(shotgun|rifle).*(fire|shoot|shot)/i, /(fire|shoot|shot).*(shotgun|rifle)/i]\n    );\n    if (!clip) return false;\n    return this.playOverride(clip, Math.min(0.56, Math.max(0.16, clip.duration)), 0.045);\n  }\n\n  playShotgunReload(): boolean {\n    const clip = this.findClip(\n      ['Shotgun_Reload', 'Reload_Shotgun', 'Rifle_Reload', 'Reload_Rifle'],\n      [/(shotgun|rifle).*reload/i, /reload.*(shotgun|rifle)/i]\n    );\n    if (!clip) return false;\n    return this.playOverride(clip, Math.max(0.32, clip.duration), 0.08);\n  }\n\n  dispose(): void {"),
            ("    const idle = exact('Pistol_Idle_Loop', 'Idle_Loop') ?? fuzzy(/pistol.*idle/i, /idle/i, /stand/i) ?? clips[0];", "    const stanceIdle = this.activeWeapon === 'pistol'\n      ? exact('Pistol_Idle_Loop') ?? fuzzy(/pistol.*idle/i)\n      : this.activeWeapon === 'shotgun'\n        ? exact('Shotgun_Idle_Loop', 'Rifle_Idle_Loop', 'Rifle_Aim_Idle_Loop') ?? fuzzy(/(shotgun|rifle).*(idle|aim)/i)\n        : exact('Bow_Idle_Loop') ?? fuzzy(/bow.*idle/i);\n    const idle = stanceIdle ?? exact('Idle_Loop') ?? fuzzy(/idle/i, /stand/i) ?? clips[0];")
          ])

          patch('src/player/PlayerRuntime.ts', [
            ("    this.setProductionVisualActive(activate);\n    return { ...result, clipNames };", "    this.weaponVisual.setActiveWeapon(this.activeWeapon);\n    this.characterModel.setActiveWeapon(this.activeWeapon);\n    this.setProductionVisualActive(activate);\n    return { ...result, clipNames };"),
            ("    this.weaponVisual.setVisible(this.productionVisualActive && this.activeWeapon === 'pistol');", "    this.weaponVisual.setVisible(this.productionVisualActive && this.activeWeapon !== 'bow');"),
            ("  setActiveWeapon(weaponId: WeaponId): void {\n    this.activeWeapon = weaponId;\n    this.weaponVisual.setVisible(this.productionVisualActive && weaponId === 'pistol');\n  }", "  setActiveWeapon(weaponId: WeaponId): void {\n    this.activeWeapon = weaponId;\n    this.characterModel.setActiveWeapon(weaponId);\n    this.weaponVisual.setActiveWeapon(weaponId);\n    this.weaponVisual.setVisible(this.productionVisualActive && weaponId !== 'bow');\n  }"),
            ("  playWeaponFire(weaponId: WeaponId): boolean {\n    if (!this.productionVisualActive || weaponId !== 'pistol') return false;\n    return this.characterModel.playPistolFire();\n  }", "  playWeaponFire(weaponId: WeaponId): boolean {\n    if (!this.productionVisualActive) return false;\n    if (weaponId === 'pistol') return this.characterModel.playPistolFire();\n    if (weaponId === 'shotgun') return this.characterModel.playShotgunFire();\n    return false;\n  }"),
            ("  playWeaponReload(weaponId: WeaponId): boolean {\n    if (!this.productionVisualActive || weaponId !== 'pistol') return false;\n    return this.characterModel.playPistolReload();\n  }", "  playWeaponReload(weaponId: WeaponId): boolean {\n    if (!this.productionVisualActive) return false;\n    if (weaponId === 'pistol') return this.characterModel.playPistolReload();\n    if (weaponId === 'shotgun') return this.characterModel.playShotgunReload();\n    return false;\n  }"),
            ("    if (this.productionVisualActive && this.activeWeapon === 'pistol' && this.weaponVisual.getMuzzleWorldPosition(out)) return out;", "    if (this.productionVisualActive && this.activeWeapon !== 'bow' && this.weaponVisual.getMuzzleWorldPosition(out)) return out;")
          ])

          p=Path('tests/unit/animation-library.test.ts'); text=p.read_text('utf-8')
          text += """

test('vendored Universal Animation Library contains long-gun combat clips', () => {
  const names = animationNames();
  const fire = names.find((name) => /(shotgun|rifle).*(fire|shoot|shot)|(fire|shoot|shot).*(shotgun|rifle)/i.test(name));
  const reload = names.find((name) => /(shotgun|rifle).*reload|reload.*(shotgun|rifle)/i.test(name));

  assert.ok(fire, `Missing shotgun/rifle fire clip. Available clips: ${names.join(', ')}`);
  assert.ok(reload, `Missing shotgun/rifle reload clip. Available clips: ${names.join(', ')}`);
});
"""
          p.write_text(text,'utf-8')

          p=Path('tests/smoke/visual-regression.spec.ts'); text=p.read_text('utf-8')
          text=text.replace("capture mobile TOP, 3RD, pistol fire/reload and uploaded-face checkpoints", "capture mobile TOP, 3RD, pistol fire/reload and uploaded-face checkpoints", 1)
          text += r'''

test('capture mobile shotgun fire and reload production checkpoints', async ({ page }) => {
  const errors: string[] = [];
  page.on('pageerror', (error) => errors.push(error.message));

  await page.goto('/engine-lab.html', { waitUntil: 'domcontentloaded' });
  await page.locator('#menuCamThird').click();
  await page.locator('#startGame').click();
  await expect(page.locator('#status')).toContainText('state=playing', { timeout: 20_000 });
  await page.waitForTimeout(1200);

  const weapon = page.locator('#touchWeapon');
  await weapon.dispatchEvent('pointerdown', pointerDown(61));
  await page.waitForTimeout(45);
  await weapon.dispatchEvent('pointerup', pointerUp(61));
  await page.waitForTimeout(120);

  const selected = await page.evaluate(() => {
    const runtimeWindow = window as Window & { __facefallApp?: any };
    const app = runtimeWindow.__facefallApp;
    if (!app) throw new Error('Facefall runtime is unavailable for weapon inspection');
    return app.weaponSystem.selected as string;
  });
  expect(selected).toBe('shotgun');

  const magazineBefore = await page.evaluate(() => {
    const runtimeWindow = window as Window & { __facefallApp?: any };
    const app = runtimeWindow.__facefallApp;
    return app.weaponSystem.runtime('shotgun').magazine as number;
  });

  const fire = page.locator('#touchFire');
  await fire.dispatchEvent('pointerdown', pointerDown(62));
  await page.waitForTimeout(120);
  await fire.dispatchEvent('pointerup', pointerUp(62));
  await page.waitForTimeout(70);

  const magazineAfter = await page.evaluate(() => {
    const runtimeWindow = window as Window & { __facefallApp?: any };
    const app = runtimeWindow.__facefallApp;
    return app.weaponSystem.runtime('shotgun').magazine as number;
  });
  expect(magazineAfter).toBeLessThan(magazineBefore);
  await page.screenshot({ path: `${artifactDir}/mobile-shotgun-fire-third.png`, fullPage: true });

  await page.waitForTimeout(700);
  const reload = page.locator('#touchReload');
  await reload.dispatchEvent('pointerdown', pointerDown(63));
  await page.waitForTimeout(45);
  await reload.dispatchEvent('pointerup', pointerUp(63));
  await page.waitForTimeout(130);

  const reloadState = await page.evaluate(() => {
    const runtimeWindow = window as Window & { __facefallApp?: any };
    const app = runtimeWindow.__facefallApp;
    return app.weaponSystem.runtime('shotgun').state as string;
  });
  expect(reloadState).toBe('reloading');
  await page.screenshot({ path: `${artifactDir}/mobile-shotgun-reload-third.png`, fullPage: true });

  expect(errors, `Fatal browser errors: ${errors.join(' | ')}`).toEqual([]);
});
'''
          p.write_text(text,'utf-8')
          PY

      - name: Commit shotgun slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'facefall-shotgun-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/characters/WeaponSocketVisual.ts src/characters/CharacterModel.ts src/player/PlayerRuntime.ts tests/unit/animation-library.test.ts tests/smoke/visual-regression.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m '0.9.2: add production shotgun slice'
          git push origin HEAD:visual/0.9.2-shotgun-production
